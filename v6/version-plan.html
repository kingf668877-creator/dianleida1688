<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本规划（编辑）- 店雷达</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d2129; padding: 24px; min-height: 100vh; }
  .container { max-width: 1180px; margin: 0 auto; background: #fff; border-radius: 12px; border: 1px solid #e5e6eb; box-shadow: 0 2px 8px rgba(20, 22, 26, 0.04); padding: 20px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { font-size: 12px; color: #86909c; margin-bottom: 18px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 8px; background: #fafbfc; border: 1px solid #eef0f3; margin-bottom: 12px; }
  .toolbar input { height: 32px; padding: 0 10px; border: 1px solid #e5e6eb; border-radius: 6px; font: 13px "PingFang SC", "Microsoft YaHei"; }
  .toolbar .grow { flex: 1; }
  .btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid #e5e6eb; background: #fff; color: #4e5969; font: 13px "PingFang SC"; cursor: pointer; }
  .btn:hover { border-color: #6236ff; color: #6236ff; }
  .btn.primary { background: #6236ff; border-color: #6236ff; color: #fff; }
  .btn.primary:hover { background: #4f2ad6; }
  .btn.danger { color: #c0364f; border-color: #f5d2d6; }
  .btn.danger:hover { background: #fdf2f4; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  thead th { text-align: left; font-size: 12px; color: #4e5969; background: #fafbfc; padding: 10px; border-bottom: 1px solid #e5e6eb; position: sticky; top: 0; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  tbody tr:hover td { background: #fafbff; }
  td input, td textarea, td select { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 6px 8px; font: 13px "PingFang SC", "Microsoft YaHei"; color: #1d2129; }
  td input:focus, td textarea:focus, td select:focus { border-color: #6236ff; background: #fff; outline: none; }
  td textarea { min-height: 60px; resize: vertical; }
  td .row-actions { display: flex; gap: 8px; }
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .status-done { background: #e8f7ee; color: #16a36a; }
  .status-planned { background: #fff4e0; color: #d97c00; }
  .status-progress { background: #eae6ff; color: #6236ff; }
  .status-bar { margin-top: 10px; font-size: 12px; color: #86909c; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status-bar .ok { color: #16a36a; }
  .status-bar .err { color: #c0364f; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #f0efff; color: #6236ff; font-size: 12px; }
  .help { font-size: 12px; color: #86909c; margin-top: 6px; }
  a.link { color: #6236ff; text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  .pat-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pat-row input { width: 320px; }
</style>
</head>
<body>
  <div class="container">
    <h1>版本规划（在线编辑）</h1>
    <div class="subtitle">可在线增/删/改/排序条目，点“提交到 Git”后写入仓库 <code>v6/version-plan.json</code></div>
    <div class="toolbar">
      <button class="btn primary" id="addRowBtn">+ 新增版本</button>
      <button class="btn" id="reloadBtn">从 GitHub 加载</button>
      <button class="btn" id="downloadBtn">下载 JSON 草稿</button>
      <button class="btn" id="uploadBtn">导入 JSON 文件</button>
      <input type="file" id="uploadInput" accept="application/json,.json" hidden>
      <span class="grow"></span>
      <div class="pat-row">
        <input id="patInput" type="password" placeholder="GitHub PAT (repo 权限)">
        <button class="btn" id="clearPatBtn">清空</button>
        <button class="btn primary" id="commitBtn">提交到 Git</button>
      </div>
    </div>
    <div class="help">PAT 仅保存在浏览器 LocalStorage。仓库：<code>kingf668877-creator/dianleida1688</code> 分支 <code>master</code> 路径 <code>v6/version-plan.json</code>。</div>
    <table id="planTable">
      <thead><tr><th style="width:110px;">版本号</th><th style="width:220px;">标题</th><th style="width:110px;">状态</th><th>要点（每行一条）</th><th style="width:130px;">计划日期</th><th style="width:150px;">操作</th></tr></thead>
      <tbody id="planBody"></tbody>
    </table>
    <div class="status-bar">
      <span id="status">就绪</span>
      <span class="pill" id="versionPill"></span>
      <a class="link" target="_blank" href="version-plan.json">查看仓库 JSON</a>
    </div>
  </div>
<script>
const REPO_OWNER='kingf668877-creator', REPO_NAME='dianleida1688', BRANCH='master', FILE_PATH='v6/version-plan.json';
const CDN_BASE='https://kingf668877-creator.github.io/dianleida1688';
const DRAFT_KEY='dianleida_version_plan_draft_v2', PAT_KEY='dianleida_version_plan_pat_v2';
const STATUS_OPTIONS=[{value:'已完成',label:'已完成',cls:'status-done'},{value:'规划中',label:'规划中',cls:'status-planned'},{value:'进行中',label:'进行中',cls:'status-progress'}];
let plans=[]; let remoteSha=null;
function statusClass(s){const o=STATUS_OPTIONS.find(x=>x.value===s); return o?o.cls:'status-progress';}
function escapeAttr(s){return String(s??'').replace(/"/g,'&quot;');}
function escapeText(s){return String(s??'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setStatus(t,k){const el=document.getElementById('status'); el.textContent=t; el.className=k||'';}
function render(){
  const body=document.getElementById('planBody'); body.innerHTML='';
  if(!plans.length){const tr=document.createElement('tr'); tr.innerHTML='<td colspan="6" style="text-align:center;color:#86909c;padding:24px;">暂无数据，点击“新增版本”开始</td>'; body.appendChild(tr); document.getElementById('versionPill').textContent='0 条'; return;}
  plans.forEach((p,i)=>{
    const tr=document.createElement('tr'); tr.dataset.index=String(i);
    tr.innerHTML=`<td><input data-field="version" value="${escapeAttr(p.version||'')}" placeholder="V2.10.0"></td>
      <td><input data-field="title" value="${escapeAttr(p.title||'')}" placeholder="标题"></td>
      <td><select data-field="status">${STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${o.value===p.status?'selected':''}>${o.label}</option>`).join('')}</select><span class="status-pill ${statusClass(p.status)}" style="margin-left:4px;">${escapeText(p.status||'规划中')}</span></td>
      <td><textarea data-field="points" placeholder="每行一个要点">${escapeText((p.points||[]).join('\n'))}</textarea></td>
      <td><input data-field="date" type="date" value="${escapeAttr(p.date||'')}"></td>
      <td class="row-actions"><button class="btn" data-act="up">上移</button><button class="btn" data-act="down">下移</button><button class="btn danger" data-act="del">删除</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('input,textarea,select').forEach(el=>{el.addEventListener('input',onCellEdit); el.addEventListener('change',onCellEdit);});
  body.querySelectorAll('button[data-act]').forEach(btn=>{btn.addEventListener('click',onAction);});
  document.getElementById('versionPill').textContent=`${plans.length} 条`;
}
function onCellEdit(e){
  const tr=e.target.closest('tr'); const idx=Number(tr.dataset.index); const field=e.target.dataset.field;
  let v=e.target.value;
  if(field==='points') v=v.split('\n').map(s=>s.trim()).filter(Boolean);
  plans[idx][field]=v;
  if(field==='status'){const pill=tr.querySelector('.status-pill'); if(pill){pill.className=`status-pill ${statusClass(v)}`; pill.textContent=v||'规划中';}}
  saveDraft();
}
function onAction(e){
  const tr=e.target.closest('tr'); const idx=Number(tr.dataset.index); const act=e.target.dataset.act;
  if(act==='up'&&idx>0){[plans[idx-1],plans[idx]]=[plans[idx],plans[idx-1]];}
  else if(act==='down'&&idx<plans.length-1){[plans[idx+1],plans[idx]]=[plans[idx],plans[idx+1]];}
  else if(act==='del'){plans.splice(idx,1);}
  render(); saveDraft();
}
function getPat(){return (document.getElementById('patInput').value||'').trim();}
function savePat(){const v=getPat(); if(v) localStorage.setItem(PAT_KEY,v); else localStorage.removeItem(PAT_KEY);}
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify(plans));}
function loadDraft(){const raw=localStorage.getItem(DRAFT_KEY); if(!raw) return false; try{const a=JSON.parse(raw); if(Array.isArray(a)&&a.length){plans=a; return true;} return false;}catch{return false;}}
async function loadFromGithub(){
  setStatus('正在从 GitHub 拉取…');
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json(); remoteSha=data.sha;
    const decoded=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    const obj=JSON.parse(decoded);
    plans=Array.isArray(obj&&obj.plans)?obj.plans:[];
    render(); saveDraft(); setStatus('已加载 GitHub 数据','ok');
  }catch(err){
    try{const r2=await fetch(`${CDN_BASE}/${FILE_PATH}?v=${Date.now()}`);
      if(r2.ok){const obj=await r2.json(); plans=Array.isArray(obj&&obj.plans)?obj.plans:[]; render(); saveDraft(); setStatus('已加载 CDN 数据（GitHub API 失败：'+err.message+'）','err'); return;}
    }catch{}
    setStatus('加载失败：'+err.message,'err');
  }
}
async function commitToGit(){
  const pat=getPat(); if(!pat){setStatus('请先在上方填入 GitHub PAT','err'); document.getElementById('patInput').focus(); return;}
  savePat(); setStatus('正在提交到 Git…');
  try{
    let sha=remoteSha;
    try{
      const g=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+pat}});
      if(g.ok){const d=await g.json(); sha=d.sha;}
    }catch{}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify({plans},null,2))));
    const body={message:'chore: update version plan ('+new Date().toISOString().replace('T',' ').slice(0,16)+')', content, committer:{name:'dianleida-plan-editor',email:'noreply@dianleida.net'}, author:{name:'dianleida-plan-editor',email:'noreply@dianleida.net'}};
    if(sha) body.sha=sha;
    const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+pat,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const t=await r.text(); if(!r.ok) throw new Error('HTTP '+r.status+' '+t);
    const data=JSON.parse(t); remoteSha=data.content&&data.content.sha;
    setStatus('提交成功：commit '+(data.commit&&data.commit.sha?data.commit.sha.slice(0,7):''),'ok');
  }catch(err){setStatus('提交失败：'+err.message,'err');}
}
function downloadDraft(){const blob=new Blob([JSON.stringify({plans},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='version-plan.json'; a.click(); URL.revokeObjectURL(url);}
function uploadDraft(file){const reader=new FileReader(); reader.onload=()=>{try{const d=JSON.parse(reader.result); plans=Array.isArray(d&&d.plans)?d.plans:[]; render(); saveDraft(); setStatus('已导入 JSON 文件','ok');}catch(e){setStatus('JSON 解析失败：'+e.message,'err');}}; reader.readAsText(file);}
document.getElementById('addRowBtn').addEventListener('click',()=>{plans.push({version:'',title:'',status:'规划中',points:[],date:''}); render(); saveDraft();});
document.getElementById('reloadBtn').addEventListener('click',loadFromGithub);
document.getElementById('commitBtn').addEventListener('click',commitToGit);
document.getElementById('downloadBtn').addEventListener('click',downloadDraft);
document.getElementById('uploadBtn').addEventListener('click',()=>document.getElementById('uploadInput').click());
document.getElementById('uploadInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0]; if(f) uploadDraft(f);});
document.getElementById('clearPatBtn').addEventListener('click',()=>{document.getElementById('patInput').value=''; localStorage.removeItem(PAT_KEY); setStatus('已清空 PAT','ok');});
document.getElementById('patInput').addEventListener('change',savePat);
document.getElementById('patInput').value=localStorage.getItem(PAT_KEY)||'';
const hadDraft=loadDraft(); if(hadDraft) render();
loadFromGithub().then(()=>{if(!plans.length&&!hadDraft){plans=[{version:'V2.9.3',title:'图搜寻源产品迭代',status:'已完成',points:['图搜寻源','功能列表','结果'],date:'2026-08-08'},{version:'V3.0.0',title:'多平台图搜支持',status:'规划中',points:['1688图搜','OZON图搜','TEMU图搜'],date:'2026-09-01'},{version:'V3.1.0',title:'AI 智能选品',status:'规划中',points:['基于结果 AI 推荐优质商品','智能筛选方向','选品预览'],date:'2026-10-01'},{version:'V3.2.0',title:'批量铺货管理',status:'规划中',points:['一键铺货多平台','铺货列表','铺货状态管理'],date:'2026-11-01'}]; render(); saveDraft();}});
</script>
</body>
</html>
