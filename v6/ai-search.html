<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能搜索分析中 - 店雷达</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d2129;
    padding: 24px;
    min-height: 100vh;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e5e6eb;
    box-shadow: 0 2px 8px rgba(20, 22, 26, 0.04);
    padding: 20px 24px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f1f3;
    margin-bottom: 20px;
  }
  .header-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6236ff 0%, #8b5cf6 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }
  .header-icon svg { width: 20px; height: 20px; }
  .header-text { line-height: 1.3; }
  .header-title { font-size: 16px; font-weight: 600; color: #1d2129; }
  .header-sub { font-size: 12px; color: #86909c; margin-top: 2px; }

  .steps { display: flex; flex-direction: column; }
  .step {
    position: relative;
    padding: 4px 0 4px 32px;
  }
  .step:not(:last-child)::before {
    content: '';
    position: absolute;
    left: 13px;
    top: 36px;
    bottom: -8px;
    width: 2px;
    background: #e5e6eb;
  }
  .step.done::before { background: #16a36a; }
  .step-icon {
    position: absolute;
    left: 0; top: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #16a36a;
    color: #fff;
    flex-shrink: 0;
  }
  .step-icon svg { width: 14px; height: 14px; }
  .step.loading .step-icon {
    background: #6236ff;
    animation: spin 1.4s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

  .step-body { padding-top: 4px; padding-bottom: 12px; }
  .step-title {
    font-size: 14px;
    font-weight: 600;
    color: #1d2129;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-title .ellipsis::after {
    content: '';
    display: inline-block;
    width: 14px;
    text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }
  .step-desc {
    font-size: 12px;
    color: #86909c;
    margin-top: 6px;
    line-height: 1.7;
  }
  .step-desc .keyword { color: #6236ff; margin-right: 6px; }
  .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    display: inline-block;
    padding: 4px 12px;
    font-size: 12px;
    color: #6236ff;
    background: #f1edff;
    border: 1px solid #d9ccff;
    border-radius: 999px;
  }

  .step-loading-title {
    color: #1d2129;
  }
  .step-loading-desc { color: #4e5969; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg>
      </span>
      <div class="header-text">
        <div class="header-title">AI 智能搜索分析中</div>
        <div class="header-sub">正在搜索商品中...</div>
      </div>
    </div>

    <div class="steps">

      <div class="step done">
        <span class="step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <div class="step-body">
          <div class="step-title">Step 1：核心词提取</div>
          <div class="step-desc">
            <span class="keyword">核心产品：</span>服装、修饰词：灯、年龄、女装、必备词：年轻、潮流
          </div>
          <div class="tags">
            <span class="tag">核心：服装</span>
            <span class="tag">修饰：时尚</span>
            <span class="tag">修饰：女装</span>
            <span class="tag">必备：年轻</span>
            <span class="tag">必备：服装</span>
          </div>
        </div>
      </div>

      <div class="step done">
        <span class="step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <div class="step-body">
          <div class="step-title">Step 2：关键词扩展</div>
          <div class="step-desc">智能扩展 4 个搜索词</div>
          <div class="tags">
            <span class="tag">女时尚年轻针织衫</span>
            <span class="tag">女时尚年轻毛衣</span>
            <span class="tag">女时尚年轻打底衫</span>
            <span class="tag">女时尚年轻外套衬衫</span>
          </div>
        </div>
      </div>

      <div class="step loading">
        <span class="step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 2 12 6 16 8"></polyline><polyline points="12 22 12 18 8 16"></polyline><polyline points="22 12 18 12 16 8"></polyline><polyline points="2 12 6 12 8 16"></polyline></svg>
        </span>
        <div class="step-body">
          <div class="step-title step-loading-title">Step 3：实时商品搜索中<span class="ellipsis"></span></div>
          <div class="step-desc step-loading-desc">搜索词：女时尚年轻针织衫、女装、女时尚年轻毛衣、女时尚年轻打底衫、女时尚年轻外套衬衫，正在搜索商品中...</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
