<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台-创建AI套餐 · V3.0.6</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d2129; }
  button { font-family: inherit; }
  .tabs-wrap { height: 48px; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #e5e6eb; gap: 4px; position: sticky; top: 0; z-index: 10; }
  .tab-btn { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent; color: #4e5969; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  .tab-btn:hover { background: #f2f3f5; color: #1d2129; }
  .tab-btn.active { background: #f0ebff; color: #6236ff; font-weight: 600; }
  .tab-dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
  .tab-preview .tab-dot { background: #ff6b6b; }
  .tab-spec .tab-dot { background: #3370ff; }
  .tab-html .tab-dot { background: #e34f26; }
  .tab-css .tab-dot { background: #1572b6; }
  .tab-js .tab-dot { background: #b58b00; }
  .panels { height: calc(100vh - 48px); overflow: hidden; position: relative; }
  .panel { position: absolute; inset: 0; display: none; overflow: auto; }
  .panel.active { display: block; }
  #panel-preview iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .empty-wrap { height: 100%; min-height: 360px; display: flex; align-items: center; justify-content: center; padding: 32px; background: #f7f8fa; }
  .empty-state { width: min(520px, 100%); padding: 52px 32px; border: 1px dashed #c9cdd4; border-radius: 12px; background: #fff; text-align: center; }
  .empty-icon { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 14px; background: #f0ebff; color: #6236ff; font-size: 17px; font-weight: 700; }
  .empty-state h1 { margin: 0 0 10px; font-size: 20px; }
  .empty-state p { margin: 0; color: #86909c; font-size: 14px; line-height: 1.7; }
  .status { display: inline-flex; margin-top: 18px; padding: 5px 11px; border-radius: 999px; background: #f2f3f5; color: #4e5969; font-size: 12px; }
  .code-panel { padding: 20px; }
  .code-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .code-header small { color: #86909c; font: 12px Consolas, monospace; }
  .copy-btn { height: 30px; padding: 0 14px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; color: #4e5969; font-size: 12px; cursor: pointer; }
  .copy-btn:hover { border-color: #6236ff; color: #6236ff; }
  .copy-btn.ok { background: #16a36a; border-color: #16a36a; color: #fff; }
  pre.code { margin: 0; padding: 20px; overflow: auto; border: 1px solid #e5e6eb; border-radius: 10px; background: #fafbfc; color: #334155; font: 13px/1.7 Consolas, "Microsoft YaHei", monospace; white-space: pre-wrap; tab-size: 2; min-height: calc(100% - 50px); }
</style>
</head>
<body>
  <div class="tabs-wrap" role="tablist" aria-label="后台-创建AI套餐原型内容">
    <button class="tab-btn tab-preview active" data-tab="preview" role="tab"><span class="tab-dot"></span>效果图</button>
    <button class="tab-btn tab-spec" data-tab="spec" role="tab"><span class="tab-dot"></span>原型说明</button>
    <button class="tab-btn tab-html" data-tab="html" role="tab"><span class="tab-dot"></span>HTML</button>
    <button class="tab-btn tab-css" data-tab="css" role="tab"><span class="tab-dot"></span>CSS</button>
    <button class="tab-btn tab-js" data-tab="js" role="tab"><span class="tab-dot"></span>JS</button>
  </div>
  <div class="panels">
    <section class="panel active" id="panel-preview"><iframe src="admin-ai-package.html?v=20261009" title="后台-创建AI套餐效果图"></iframe></section>
    <section class="panel" id="panel-spec">
      <div class="empty-wrap"><div class="empty-state"><div class="empty-icon">SPEC</div><h1>后台-创建AI套餐</h1><p>展示后台套餐管理页面。点击“创建套餐”可查看套餐配置表单；页面内数据保存在当前浏览器中。HTML、CSS、JS 标签分别展示对应源码。</p><span class="status">原型演示</span></div></div>
    </section>
    <section class="panel code-panel" id="panel-html"><div class="code-header"><small>admin-ai-package.html</small><button class="copy-btn" data-copy="html">复制 HTML</button></div><pre class="code" id="codeHtml">正在加载…</pre></section>
    <section class="panel code-panel" id="panel-css"><div class="code-header"><small>admin-ai-package.css</small><button class="copy-btn" data-copy="css">复制 CSS</button></div><pre class="code" id="codeCss">正在加载…</pre></section>
    <section class="panel code-panel" id="panel-js"><div class="code-header"><small>admin-ai-package.js</small><button class="copy-btn" data-copy="js">复制 JS</button></div><pre class="code" id="codeJs">正在加载…</pre></section>
  </div>
<script>
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.panel');
  const codeCache = { html: '', css: '', js: '' };
  tabs.forEach(button => button.addEventListener('click', () => {
    const tab = button.dataset.tab;
    tabs.forEach(node => node.classList.toggle('active', node === button));
    panels.forEach(panel => panel.classList.toggle('active', panel.id === 'panel-' + tab));
  }));
  function loadCode(type, url, targetId) {
    fetch(url + '?v=20261009').then(response => {
      if (!response.ok) throw new Error('加载失败');
      return response.text();
    }).then(text => {
      codeCache[type] = text;
      document.getElementById(targetId).textContent = text;
    }).catch(() => {
      document.getElementById(targetId).textContent = '源码加载失败，请刷新页面后重试。';
    });
  }
  loadCode('html', 'admin-ai-package.html', 'codeHtml');
  loadCode('css', 'admin-ai-package.css', 'codeCss');
  loadCode('js', 'admin-ai-package.js', 'codeJs');
  document.querySelectorAll('.copy-btn').forEach(button => button.addEventListener('click', async () => {
    const text = codeCache[button.dataset.copy];
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const old = button.textContent;
      button.textContent = '已复制';
      button.classList.add('ok');
      setTimeout(() => { button.textContent = old; button.classList.remove('ok'); }, 1500);
    } catch (error) { button.textContent = '复制失败'; }
  }));
</script>
</body>
</html>
