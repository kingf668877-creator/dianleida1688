<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建图搜寻源</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d2129; }
  button, input, select { font-family: inherit; }
  .tabs-wrap { height: 48px; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #e5e6eb; gap: 4px; position: sticky; top: 0; z-index: 10; }
  .tab-btn { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent; color: #4e5969; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; text-decoration: none; display: inline-flex; align-items: center; }
  .tab-btn:hover { background: #f2f3f5; color: #1d2129; }
  .tab-btn.active { background: #f0ebff; color: #6236ff; font-weight: 600; }
  .tab-btn .tab-dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
  .tab-preview .tab-dot { background: #ff6b6b; }
  .tab-spec .tab-dot { background: #3370ff; }
  .tab-html .tab-dot { background: #e34f26; }
  .tab-css .tab-dot { background: #1572b6; }
  .tab-js .tab-dot { background: #b58b00; }
  .panels { height: calc(100vh - 48px); overflow: hidden; position: relative; }
  .panel { position: absolute; inset: 0; display: none; overflow: auto; }
  .panel.active { display: block; }
  #panel-preview iframe { width: 100%; height: 100%; border: 0; display: block; }
  .spec-panel-page { background: #f7f8fa; padding: 18px; }
  .spec-doc { max-width: 1500px; height: calc(100vh - 84px); margin: 0 auto; background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .spec-head { padding: 16px 20px; border-bottom: 1px solid #eef0f2; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-shrink: 0; }
  .spec-head-left { min-width: 0; }
  .spec-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .spec-title .section-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #f0ebff; color: #6236ff; }
  .spec-sub { font-size: 12px; color: #86909c; }
  .spec-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .spec-link-btn { height: 32px; padding: 0 14px; border: 1px solid #dfe3e8; border-radius: 6px; background: #fff; color: #4e5969; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: .15s; }
  .spec-link-btn:hover { border-color: #3370ff; color: #3370ff; }
  .spec-link-btn.primary { background: #3370ff; border-color: #3370ff; color: #fff; }
  .spec-link-btn.primary:hover { background: #2455d9; color: #fff; }
  .spec-iframe-wrap { flex: 1; position: relative; background: #fafbfc; }
  .spec-iframe { width: 100%; height: 100%; border: 0; display: block; }
  .spec-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #86909c; font-size: 13px; background: #fafbfc; }
  .spec-loading .spinner { width: 28px; height: 28px; border: 3px solid #e5e6eb; border-top-color: #3370ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spec-fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; background: #fafbfc; }
  .spec-fallback.show { display: flex; }
  .spec-fallback-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
  .spec-fallback-title { font-size: 16px; font-weight: 600; color: #1d2129; margin-bottom: 8px; }
  .spec-fallback-desc { font-size: 13px; color: #86909c; line-height: 1.6; margin-bottom: 20px; max-width: 400px; }
  .code-panel { padding: 20px; }
  .code-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .code-header small { color: #86909c; font: 12px Consolas, monospace; }
  .section-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #f0ebff; color: #6236ff; }
  .copy-btn { height: 30px; padding: 0 14px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; color: #4e5969; font-size: 12px; cursor: pointer; transition: .15s; }
  .copy-btn:hover { border-color: #6236ff; color: #6236ff; }
  .copy-btn.ok { background: #16a36a; border-color: #16a36a; color: #fff; }
  pre.code { margin: 0; padding: 20px; overflow: auto; border: 1px solid #e5e6eb; border-radius: 10px; background: #fafbfc; color: #334155; font: 13px/1.7 Consolas, "Microsoft YaHei", monospace; white-space: pre; tab-size: 2; min-height: calc(100% - 50px); }
  @media(max-width:900px){ .spec-panel-page { padding: 9px; } .spec-head { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
  <div class="tabs-wrap" role="tablist">
    <button class="tab-btn tab-preview active" data-tab="preview" role="tab"><span class="tab-dot"></span>效果图</button>
    <button class="tab-btn tab-spec" data-tab="spec" role="tab"><span class="tab-dot"></span>原型说明</button>
    <button class="tab-btn tab-html" data-tab="html" role="tab"><span class="tab-dot"></span>HTML</button>
    <button class="tab-btn tab-css" data-tab="css" role="tab"><span class="tab-dot"></span>CSS</button>
    <button class="tab-btn tab-js" data-tab="js" role="tab"><span class="tab-dot"></span>JS</button>
  </div>
  <div class="panels">
    <section class="panel active" id="panel-preview"><iframe id="previewFrame" src="../ai-three-step.html" title="效果图"></iframe></section>
    <section class="panel spec-panel-page" id="panel-spec">
      <article class="spec-doc">
        <header class="spec-head">
          <div class="spec-head-left">
            <h1 class="spec-title">原型说明 <span class="section-tag" id="specSectionTag">创建图搜寻源</span></h1>
            <div class="spec-sub">查看《店雷达原型说明》语雀文档，对应当前页面模块</div>
          </div>
          <div class="spec-actions">
            <a class="spec-link-btn" id="specExternalLink" href="https://www.yuque.com/u26544515/sldqp9/xlf8hgmqhski5mfe?singleDoc#" target="_blank" rel="noopener">新窗口打开 ↗</a>
            <button class="spec-link-btn primary" id="specReloadBtn">重新加载</button>
          </div>
        </header>
        <div class="spec-iframe-wrap">
          <iframe id="specIframe" class="spec-iframe" src="about:blank" referrerpolicy="no-referrer"></iframe>
          <div class="spec-loading" id="specLoading"><div class="spinner"></div><div>正在加载语雀文档…</div></div>
          <div class="spec-fallback" id="specFallback">
            <div class="spec-fallback-icon">��</div>
            <div class="spec-fallback-title">文档加载失败</div>
            <div class="spec-fallback-desc">当前页面无法内嵌语雀文档（可能因为浏览器的安全策略或网络问题）。你可以点击下方按钮在新窗口打开，或者查看备用的本地文档。</div>
            <a class="spec-link-btn primary" id="specFallbackOpen" href="https://www.yuque.com/u26544515/sldqp9/xlf8hgmqhski5mfe?singleDoc#" target="_blank" rel="noopener">新窗口打开文档 ↗</a>
          </div>
        </div>
      </article>
    </section>
    <section class="panel code-panel" id="panel-html"><div class="code-header"><small id="htmlFileName">ai-three-step.html</small><button class="copy-btn" data-copy="html">复制 HTML</button></div><pre class="code" id="codeHtml">正在加载…</pre></section>
    <section class="panel code-panel" id="panel-css"><div class="code-header"><small id="cssFileName">ai-three-step.css</small><button class="copy-btn" data-copy="css">复制 CSS</button></div><pre class="code" id="codeCss">正在加载…</pre></section>
    <section class="panel code-panel" id="panel-js"><div class="code-header"><small id="jsFileName">ai-three-step.js</small><button class="copy-btn" data-copy="js">复制 JS</button></div><pre class="code" id="codeJs">正在加载…</pre></section>
  </div>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const pageParam = urlParams.get('page');
  const PREVIEW_VERSION = 'yuque-embed-20260810';
  let currentPage = 'create';
  let iframeSrc = `../ai-three-step.html?v=${PREVIEW_VERSION}`;
  if (pageParam === 'list') { currentPage = 'list'; iframeSrc = `../ai-three-step.html?page=list&v=${PREVIEW_VERSION}`; }
  else if (pageParam === 'result') { currentPage = 'result'; iframeSrc = `../ai-three-step.html?page=result&v=${PREVIEW_VERSION}`; }
  else if (pageParam === 'package') { currentPage = 'package'; iframeSrc = `../ai-three-step.html?page=package&v=${PREVIEW_VERSION}`; }
  document.getElementById('previewFrame').src = iframeSrc;

  const sectionLabels = { create: '创建图搜寻源', list: '任务列表', result: '寻源结果', package: '套餐配置' };
  const yuqueAnchors = { create: '', list: '任务列表', result: '寻源结果', package: '套餐配置' };
  const YUQUE_BASE = 'https://www.yuque.com/u26544515/sldqp9/xlf8hgmqhski5mfe?singleDoc#';

  function getYuqueUrl(page) {
    const anchor = yuqueAnchors[page] || '';
    return YUQUE_BASE + (anchor ? encodeURIComponent(anchor) : '');
  }

  function updateCodeHeaders(page) {
    const label = sectionLabels[page] || '';
    document.getElementById('htmlFileName').innerHTML = `ai-three-step.html <span class="section-tag">${label}</span>`;
    document.getElementById('cssFileName').innerHTML = `ai-three-step.css <span class="section-tag">${label}</span>`;
    document.getElementById('jsFileName').innerHTML = `ai-three-step.js <span class="section-tag">${label}</span>`;
    document.getElementById('specSectionTag').textContent = label;
    const url = getYuqueUrl(page);
    document.getElementById('specExternalLink').href = url;
    document.getElementById('specFallbackOpen').href = url;
    document.title = label;
  }

  function loadSpecDoc() {
    const iframe = document.getElementById('specIframe');
    const loading = document.getElementById('specLoading');
    const fallback = document.getElementById('specFallback');
    const url = getYuqueUrl(currentPage);
    loading.style.display = 'flex';
    fallback.classList.remove('show');
    iframe.src = 'about:blank';
    iframe.src = url;
  }

  let specLoadTimer = null;
  document.getElementById('specIframe').addEventListener('load', () => {
    clearTimeout(specLoadTimer);
    document.getElementById('specLoading').style.display = 'none';
    try {
      const iframe = document.getElementById('specIframe');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc || doc.location.href === 'about:blank') return;
    } catch (e) {
      document.getElementById('specFallback').classList.add('show');
    }
  });
  document.getElementById('specReloadBtn').addEventListener('click', loadSpecDoc);

  updateCodeHeaders(currentPage);

  const tabs = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(btn => btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    tabs.forEach(b => b.classList.toggle('active', b === btn));
    panels.forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
    if (tab === 'spec') loadSpecDoc();
  }));

  const codeCache = { html: '', css: '', js: '' };
  function extractHtmlSection(text, section) {
    const sectionIds = { create: 'page-create', list: 'page-list', result: 'page-result', package: 'page-package' };
    const id = sectionIds[section];
    if (!id) return text;
    const regex = new RegExp('<section[^>]*id="' + id + '"[^>]*>[\\s\\S]*?<\\/section>', 'g');
    const match = text.match(regex);
    return match ? match[0].trim() : text;
  }
  function extractCssSection(text, section) {
    const sectionMap = {
      create: [['/* ===== CSS 变量 ===== */', '/* ===== 任务列表功能横幅 ===== */'], ['/* ===== 创建卡片 ===== */', '/* ===== 筛选卡片 ===== */'], ['/* ===== 编辑模式 ===== */', '/* ===== 滚动条美化 ===== */']],
      list: [['/* ===== 任务列表功能横幅 ===== */', '/* ===== 创建卡片 ===== */'], ['/* ===== 张数统计 ===== */', '/* ===== 筛选卡片 ===== */'], ['/* ===== 筛选卡片 ===== */', '/* ===== 寻源结果 - 搜索图源信息条 ===== */'], ['/* ===== 分页 ===== */', '/* ===== 编辑模式 ===== */']],
      result: [['/* ===== 寻源结果 - 搜索图源信息条 ===== */', '/* ===== 分页 ===== */']]
    };
    const ranges = sectionMap[section];
    if (!ranges) return text;
    const parts = [];
    for (const [start, end] of ranges) {
      const startIdx = text.indexOf(start), endIdx = text.indexOf(end);
      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) parts.push(text.substring(startIdx, endIdx).trim());
    }
    return parts.length > 0 ? parts.join('\n\n') : text;
  }
  function extractJsSection(text, section) {
    const sectionMap = { create: [['// ===== 模拟任务数据 =====', '// ===== 任务列表 =====']], list: [['// ===== 张数管理 =====', '// ===== 任务列表 ====='], ['// ===== 任务列表 =====', '// ===== 寻源结果数据 =====']], result: [['// ===== 寻源结果数据 =====', null]] };
    const ranges = sectionMap[section];
    if (!ranges) return text;
    const parts = [];
    for (const [start, end] of ranges) {
      const startIdx = text.indexOf(start), endIdx = end ? text.indexOf(end) : text.length;
      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) parts.push(text.substring(startIdx, endIdx).trim());
    }
    return parts.length > 0 ? parts.join('\n\n') : text;
  }
  function loadCode(type, url, targetId, extractFn) {
    fetch(url).then(r => { if (!r.ok) throw new Error('加载失败'); return r.text(); })
      .then(text => { const extracted = extractFn(text, currentPage); codeCache[type] = extracted; document.getElementById(targetId).textContent = extracted; })
      .catch(() => { document.getElementById(targetId).textContent = '加载失败：' + url; });
  }
  function reloadAllCode() {
    loadCode('html', '../ai-three-step.html', 'codeHtml', extractHtmlSection);
    loadCode('css', '../ai-three-step.css', 'codeCss', extractCssSection);
    loadCode('js', '../ai-three-step.js', 'codeJs', extractJsSection);
  }
  reloadAllCode();
  document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', async () => {
    const type = btn.dataset.copy, text = codeCache[type];
    if (!text) return;
    try { await navigator.clipboard.writeText(text); const old = btn.textContent; btn.textContent = '已复制'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1600); }
    catch (e) { btn.textContent = '复制失败'; }
  }));
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'pageChange') {
      const page = e.data.page;
      if (!page || !sectionLabels[page]) return;
      currentPage = page;
      const newUrl = new URL(window.location);
      if (page === 'create') newUrl.searchParams.delete('page'); else newUrl.searchParams.set('page', page);
      window.history.replaceState({}, '', newUrl);
      updateCodeHeaders(page);
      reloadAllCode();
      const activeTab = document.querySelector('.tab-btn.active');
      if (activeTab && activeTab.dataset.tab === 'spec') loadSpecDoc();
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'pageChange', page: page }, '*'); } catch(err) {}
    }
  });
</script>
</body>
</html>
