<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本规划</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#2d3436;padding:32px;}
  .header{margin-bottom:32px;}
  .header h1{font-size:28px;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
  .header p{font-size:14px;color:#636e72;}
  .version-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
  .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #eee;transition:all .2s;}
  .card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.1);transform:translateY(-2px);}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .card-version{font-size:20px;font-weight:700;color:#1a1a2e;}
  .badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge.done{background:#e6f9ee;color:#00b894;}
  .badge.planning{background:#fff3e0;color:#f59e0b;}
  .card-desc{font-size:14px;color:#636e72;line-height:1.6;margin-bottom:12px;}
  .card-features{font-size:13px;color:#2d3436;line-height:1.8;}
  .card-features li{list-style:none;padding-left:16px;position:relative;}
  .card-features li:before{content:'';width:6px;height:6px;background:#74b9ff;border-radius:50%;position:absolute;left:0;top:9px;}
  .card-date{font-size:12px;color:#b2bec3;margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;}
</style>
</head>
<body>
<div class="header">
  <h1>版本规划</h1>
  <p>产品路线图 - 功能列表</p>
</div>
<div class="version-cards">
  <div class="card">
    <div class="card-header">
      <span class="card-version">V2.9.3</span>
      <span class="badge done">已完成</span>
    </div>
    <p class="card-desc">图搜寻源产品迭代</p>
    <ul class="card-features">
      <li>图搜寻源</li>
      <li>功能列表</li>
      <li>结果</li>
    </ul>
    <div class="card-date">2026-08-08</div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-version">V3.0.0</span>
      <span class="badge planning">规划中</span>
    </div>
    <p class="card-desc">多平台图搜支持</p>
    <ul class="card-features">
      <li>1688图搜</li>
      <li>Ozon图搜</li>
      <li>TEMU图搜</li>
    </ul>
    <div class="card-date">日期: 2026-09-01</div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-version">V3.1.0</span>
      <span class="badge planning">规划中</span>
    </div>
    <p class="card-desc">AI智能选品</p>
    <ul class="card-features">
      <li>基于结果 AI 推荐优质商品</li>
      <li>智能商品列表</li>
      <li>选品商品</li>
    </ul>
    <div class="card-date">日期: 2026-10-01</div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-version">V3.2.0</span>
      <span class="badge planning">规划中</span>
    </div>
    <p class="card-desc">批量铺货管理</p>
    <ul class="card-features">
      <li>一键铺货多平台</li>
      <li>铺货列表</li>
      <li>铺货状态管理</li>
    </ul>
    <div class="card-date">日期: 2026-11-01</div>
  </div>
</div>
</body>
</html>
