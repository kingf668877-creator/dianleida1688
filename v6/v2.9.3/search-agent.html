<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建图搜寻源</title>
  <link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d2129; }
  .tabs-wrap {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: #fff;
    border-bottom: 1px solid #e5e6eb;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    height: 32px;
    padding: 0 16px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #4e5969;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-btn:hover { background: #f2f3f5; color: #1d2129; }
  .tab-btn.active {
    background: #f0ebff;
    color: #6236ff;
    font-weight: 600;
  }
  .tab-btn .tab-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    border-radius: 3px;
    vertical-align: -1px;
  }
  .tab-preview .tab-dot { background: #ff6b6b; }
  .tab-html .tab-dot { background: #e34f26; }
  .tab-css .tab-dot { background: #1572b6; }
  .tab-js .tab-dot { background: #b58b00; }
  .panels {
    height: calc(100vh - 48px);
    overflow: hidden;
    position: relative;
  }
  .panel {
    position: absolute;
    inset: 0;
    display: none;
    overflow: auto;
  }
  .panel.active { display: block; }
  /* 效果图面板 */
  #panel-preview iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  /* 代码面板通用 */
  .code-panel {
    padding: 20px;
  }
  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .code-header small {
    color: #86909c;
    font: 12px Consolas, monospace;
  }
  .section-tag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    background: #f0ebff;
    color: #6236ff;
  }
  .copy-btn {
    height: 30px;
    padding: 0 14px;
    border: 1px solid #e5e6eb;
    border-radius: 6px;
    background: #fff;
    color: #4e5969;
    font-size: 12px;
    cursor: pointer;
    transition: .15s;
  }
  .copy-btn:hover { border-color: #6236ff; color: #6236ff; }
  .copy-btn.ok { background: #16a36a; border-color: #16a36a; color: #fff; }
  pre.code {
    margin: 0;
    padding: 20px;
    overflow: auto;
    border: 1px solid #e5e6eb;
    border-radius: 10px;
    background: #fafbfc;
    color: #334155;
    font: 13px/1.7 Consolas, "Microsoft YaHei", monospace;
    white-space: pre;
    tab-size: 2;
    min-height: calc(100% - 50px);
  }
</style>
</head>
<body>
  <div class="tabs-wrap" role="tablist">
    <button class="tab-btn tab-preview active" data-tab="preview" role="tab">
      <span class="tab-dot"></span>效果图
    </button>
    <button class="tab-btn tab-html" data-tab="html" role="tab">
      <span class="tab-dot"></span>HTML
    </button>
    <button class="tab-btn tab-css" data-tab="css" role="tab">
      <span class="tab-dot"></span>CSS
    </button>
    <button class="tab-btn tab-js" data-tab="js" role="tab">
      <span class="tab-dot"></span>JS
    </button>
  </div>
  <div class="panels">
    <!-- 效果图 -->
    <section class="panel active" id="panel-preview">
      <iframe id="previewFrame" src="ai-three-step.html" title="效果图"></iframe>
    </section>
    <!-- HTML -->
    <section class="panel code-panel" id="panel-html">
      <div class="code-header">
        <small id="htmlFileName">ai-three-step.html</small>
        <button class="copy-btn" data-copy="html">复制 HTML</button>
      </div>
      <pre class="code" id="codeHtml">正在加载…</pre>
    </section>
    <!-- CSS -->
    <section class="panel code-panel" id="panel-css">
      <div class="code-header">
        <small id="cssFileName">ai-three-step.css</small>
        <button class="copy-btn" data-copy="css">复制 CSS</button>
      </div>
      <pre class="code" id="codeCss">正在加载…</pre>
    </section>
    <!-- JS -->
    <section class="panel code-panel" id="panel-js">
      <div class="code-header">
        <small id="jsFileName">ai-three-step.js</small>
        <button class="copy-btn" data-copy="js">复制 JS</button>
      </div>
      <pre class="code" id="codeJs">正在加载…</pre>
    </section>
  </div>
<script>
  // ===== 读取 URL 参数，确定当前板块 =====
  const urlParams = new URLSearchParams(window.location.search);
  const pageParam = urlParams.get('page');
  let currentPage = 'create';
  let iframeSrc = 'ai-three-step.html';

  if (pageParam === 'list') {
    currentPage = 'list';
    iframeSrc = 'ai-three-step.html?page=list';
  } else if (pageParam === 'result') {
    currentPage = 'result';
    iframeSrc = 'ai-three-step.html?page=result';
  }
  document.getElementById('previewFrame').src = iframeSrc;

  // ===== 板块标签映射 =====
  const sectionLabels = {
    create: '创建图搜寻源',
    list: '任务列表',
    result: '寻源结果'
  };

  // ===== 更新代码面板标题 =====
  function updateCodeHeaders(page) {
    const label = sectionLabels[page] || '';
    document.getElementById('htmlFileName').innerHTML = `ai-three-step.html <span class="section-tag">${label}</span>`;
    document.getElementById('cssFileName').innerHTML = `ai-three-step.css <span class="section-tag">${label}</span>`;
    document.getElementById('jsFileName').innerHTML = `ai-three-step.js <span class="section-tag">${label}</span>`;
    document.title = label;
  }
  updateCodeHeaders(currentPage);

  // ===== Tab 切换 =====
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.panel');
  const codeCache = { html: '', css: '', js: '' };

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      tabs.forEach(b => b.classList.toggle('active', b === btn));
      panels.forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
    });
  });

  // ===== 提取 HTML 板块代码 =====
  function extractHtmlSection(text, section) {
    const sectionIds = {
      create: 'page-create',
      list: 'page-list',
      result: 'page-result'
    };
    const id = sectionIds[section];
    if (!id) return text;
    // 匹配 <section ... id="page-xxx" ...>...</section>
    const regex = new RegExp(
      '<section[^>]*id="' + id + '"[^>]*>[\\s\\S]*?<\\/section>',
      'g'
    );
    const match = text.match(regex);
    return match ? match[0].trim() : text;
  }

  // ===== 提取 CSS 板块代码 =====
  // 利用已有的 CSS 注释作为分界标记，提取当前板块相关样式
  function extractCssSection(text, section) {
    const sectionMap = {
      create: [
        ['/* ===== CSS 变量 ===== */', '/* ===== 任务列表功能横幅 ===== */'],
        ['/* ===== 创建卡片 ===== */', '/* ===== 筛选卡片 ===== */'],
        ['/* ===== 编辑模式 ===== */', '/* ===== 滚动条美化 ===== */'],
      ],
      list: [
        ['/* ===== 任务列表功能横幅 ===== */', '/* ===== 创建卡片 ===== */'],
        ['/* ===== 筛选卡片 ===== */', '/* ===== 寻源结果 - 搜索图源信息条 ===== */'],
        ['/* ===== 分页 ===== */', '/* ===== 编辑模式 ===== */'],
      ],
      result: [
        ['/* ===== 寻源结果 - 搜索图源信息条 ===== */', '/* ===== 分页 ===== */'],
      ],
    };

    const ranges = sectionMap[section];
    if (!ranges) return text;

    const parts = [];
    for (const [start, end] of ranges) {
      const startIdx = text.indexOf(start);
      const endIdx = text.indexOf(end);
      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
        parts.push(text.substring(startIdx, endIdx).trim());
      }
    }
    return parts.length > 0 ? parts.join('\n\n') : text;
  }

  // ===== 提取 JS 板块代码 =====
  // 利用已有的 JS 注释作为分界标记，提取当前板块相关逻辑
  function extractJsSection(text, section) {
    const sectionMap = {
      create: [
        ['// ===== 模拟任务数据 =====', '// ===== 任务列表 ====='],
      ],
      list: [
        ['// ===== 任务列表 =====', '// ===== 寻源结果数据 ====='],
      ],
      result: [
        ['// ===== 寻源结果数据 =====', null],
      ],
    };

    const ranges = sectionMap[section];
    if (!ranges) return text;

    const parts = [];
    for (const [start, end] of ranges) {
      const startIdx = text.indexOf(start);
      const endIdx = end ? text.indexOf(end) : text.length;
      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
        parts.push(text.substring(startIdx, endIdx).trim());
      }
    }
    return parts.length > 0 ? parts.join('\n\n') : text;
  }

  // ===== 加载源码（提取当前板块）=====
  function loadCode(type, url, targetId, extractFn) {
    fetch(url).then(r => { if (!r.ok) throw new Error('加载失败'); return r.text(); })
      .then(text => {
        const extracted = extractFn(text, currentPage);
        codeCache[type] = extracted;
        document.getElementById(targetId).textContent = extracted;
      })
      .catch(() => {
        document.getElementById(targetId).textContent = '加载失败：' + url;
      });
  }

  function reloadAllCode() {
    loadCode('html', 'ai-three-step.html', 'codeHtml', extractHtmlSection);
    loadCode('css', 'ai-three-step.css', 'codeCss', extractCssSection);
    loadCode('js', 'ai-three-step.js', 'codeJs', extractJsSection);
  }
  reloadAllCode();

  // ===== 复制按钮 =====
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const type = btn.dataset.copy;
      const text = codeCache[type];
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const old = btn.textContent;
        btn.textContent = '已复制';
        btn.classList.add('ok');
        setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1600);
      } catch (e) {
        btn.textContent = '复制失败';
      }
    });
  });

  // ===== 监听 iframe 内部页面切换（postMessage）=====
  // 当 ai-three-step.html 内部调用 switchPage 时，会向 parent 发送消息
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'pageChange') {
      const page = e.data.page;
      if (!page || !sectionLabels[page]) return;

      // 更新当前板块
      currentPage = page;

      // 更新 URL（不刷新页面）
      const newUrl = new URL(window.location);
      if (page === 'create') {
        newUrl.searchParams.delete('page');
      } else {
        newUrl.searchParams.set('page', page);
      }
      window.history.replaceState({}, '', newUrl);

      // 更新标题
      updateCodeHeaders(page);

      // 重新加载代码（只展示当前板块）
      reloadAllCode();

      // 转发给最外层父窗口（dev-mode.html）以同步侧边栏
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pageChange', page: page }, '*');
        }
      } catch(err) {}
    }
  });
</script>
</body>
</html>
