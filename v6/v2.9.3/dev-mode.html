<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店雷达 - 开发模式</title>
  <link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --blue:#3370ff; --border:#e5e6eb; --text:#1d2129; --muted:#86909c; --hover:#f2f3f5; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#f5f6f8; }
  .app { display:flex; width:100%; height:100vh; }
  /* 侧边栏 */
  .layers {
    width:224px; flex:0 0 224px;
    background:#fff; border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition: width .25s ease, flex-basis .25s ease;
    overflow:hidden;
  }
  .layers.collapsed {
    width:0; flex-basis:0;
    border-right:0;
  }
  .layers-title {
    height:52px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:0 16px; border-bottom:1px solid var(--border);
    font-size:15px; font-weight:600; flex-shrink:0;
  }
  .layers-title-left { display:flex; align-items:center; gap:10px; min-width:0; }
  .layers-title img { width:28px; height:28px; border-radius:6px; flex:0 0 28px; }
  .layers-title span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toggle-btn {
    width:28px; height:28px; flex-shrink:0;
    border:0; border-radius:6px;
    background:transparent; color:#86909c;
    cursor:pointer; font-size:14px;
    display:grid; place-items:center;
    transition:.15s;
  }
  .toggle-btn:hover { background:var(--hover); color:var(--text); }
  .search-wrap { padding:10px 12px 0; flex-shrink:0; }
  .search-input {
    width:100%; height:34px; padding:0 12px;
    border:1px solid var(--border); border-radius:8px;
    color:#1d2129; outline:none;
    font:13px/1 "PingFang SC","Microsoft YaHei",sans-serif;
  }
  .search-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(51,112,255,.10); }
  .search-input::placeholder { color:#a8abb2; }
  .layer-list { padding:10px 8px; flex:1; overflow-y:auto; }
  .version-folder {
    width:100%; height:34px; padding:0 10px;
    border:0; border-radius:6px; background:transparent;
    color:#4e5969; display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; text-align:left;
    cursor:pointer; transition:.15s;
  }
  .version-folder:hover { background:var(--hover); }
  .version-folder .folder-arrow {
    width:14px; display:inline-block;
    transition: transform .2s ease;
    font-size:10px; color:#86909c;
  }
  .version-folder.open .folder-arrow { transform: rotate(90deg); }
  .version-badge {
    margin-left:auto;
    font-size:10px; font-weight:500;
    padding:2px 6px; border-radius:4px;
    background:#e8f0ff; color:var(--blue);
  }
  .version-pages {
    padding:4px 0 0 22px;
    display:none;
  }
  .version-pages.open { display:block; }
  .layer-empty { display:none; padding:18px 12px; color:#a8abb2; font-size:12px; text-align:center; }
  .layer-item {
    width:100%; height:42px; padding:0 12px;
    border:0; border-radius:6px; background:transparent;
    color:#4e5969; display:flex; align-items:center; gap:10px;
    font-size:13px; cursor:pointer; text-align:left;
    transition:.16s ease;
  }
  .layer-item:hover { background:var(--hover); color:var(--text); }
  .layer-item.active { color:var(--blue); background:#e8f0ff; font-weight:500; }
  .layer-icon {
    width:22px; height:22px; border-radius:5px;
    display:grid; place-items:center;
    color:#fff; font-size:11px; font-weight:700;
  }
  .icon-p { background:#ff6b6b; }
  /* 主内容区 */
  .stage { min-width:0; flex:1; height:100%; background:#eef0f3; padding:20px; position:relative; display:flex; gap:16px; }
  .frame-shell { flex:1; min-width:0; height:100%; overflow:hidden; background:#fff; border:1px solid #dfe1e5; border-radius:8px; box-shadow:0 8px 24px rgba(29,33,41,.08); }
  iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
  /* 侧边栏收起时的展开按钮 */
  .expand-btn {
    position:fixed; top:12px; left:12px; z-index:100;
    width:40px; height:40px;
    border:1px solid var(--border); border-radius:10px;
    background:#fff; color:#4e5969;
    cursor:pointer; font-size:16px;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:.15s;
  }
  .expand-btn:hover { background:var(--hover); color:var(--text); }
  .expand-btn.show { display:flex; }

  /* ===== 原型说明面板 ===== */
  .spec-panel {
    display:none !important;
    width:440px; flex:0 0 440px;
    height:100%; background:#fff;
    border:1px solid #dfe1e5; border-radius:8px;
    box-shadow:0 8px 24px rgba(29,33,41,.08);
    display:flex; flex-direction:column;
    transition: width .25s ease, flex-basis .25s ease, opacity .25s ease;
    overflow:hidden;
  }
  .spec-panel.collapsed {
    width:0; flex-basis:0; opacity:0; border:0;
  }
  .spec-header {
    height:52px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--border);
    background:#fafbfc;
  }
  .spec-header-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .spec-header h3 { font-size:15px; font-weight:600; white-space:nowrap; }
  .spec-page-tag {
    font-size:11px; padding:2px 8px; border-radius:4px;
    background:#e8f0ff; color:var(--blue); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;
  }
  .spec-header-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .spec-btn {
    height:30px; padding:0 12px;
    border:1px solid var(--border); border-radius:6px;
    background:#fff; color:#4e5969;
    font-size:12px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    transition:.15s; white-space:nowrap;
  }
  .spec-btn:hover { background:var(--hover); color:var(--text); }
  .spec-btn.primary {
    background:var(--blue); border-color:var(--blue); color:#fff;
  }
  .spec-btn.primary:hover { background:#2455d9; }
  .spec-btn.success {
    background:#00b894; border-color:#00b894; color:#fff;
  }
  .spec-btn.success:hover { background:#00a081; }
  .spec-btn.danger { color:#e54848; }
  .spec-btn.danger:hover { background:#fff0f0; }
  .spec-btn.icon-only { width:30px; padding:0; justify-content:center; }

  /* 表格容器 */
  .spec-table-wrap {
    flex:1; overflow:auto; position:relative;
  }
  .spec-table {
    width:100%; border-collapse:collapse; font-size:13px;
    table-layout:fixed;
  }
  .spec-table th, .spec-table td {
    border:1px solid #e8e8f0; padding:0; position:relative;
    vertical-align:top;
  }
  .spec-table th {
    background:#f7f8fa; font-weight:600; color:#4e5969;
    height:40px; text-align:left; padding:0 10px;
    display:table-cell;
  }
  .spec-table th .th-content {
    display:flex; align-items:center; justify-content:space-between;
    height:100%; gap:4px;
  }
  .spec-table th .th-text {
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    cursor:text; outline:none;
  }
  .spec-table th .th-text:focus { color:var(--blue); }
  .spec-table th .th-del {
    width:18px; height:18px; border-radius:4px;
    border:0; background:transparent; color:#c9cdd4;
    cursor:pointer; font-size:12px; flex-shrink:0;
    display:none; align-items:center; justify-content:center;
    transition:.15s;
  }
  .spec-table th:hover .th-del { display:flex; }
  .spec-table th .th-del:hover { background:#fff0f0; color:#e54848; }

  .spec-table td .cell-edit {
    width:100%; min-height:38px; max-height:120px;
    padding:8px 10px; border:0; outline:none;
    font:13px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;
    color:#1d2129; background:transparent;
    resize:vertical; overflow-y:auto;
    cursor:text;
  }
  .spec-table td .cell-edit:focus { background:#f7f9ff; box-shadow:inset 0 0 0 2px rgba(51,112,255,.12); }
  .spec-table td .cell-edit:empty::before {
    content:attr(data-placeholder); color:#c9cdd4;
  }

  /* 行号 */
  .spec-table .row-num-cell {
    width:36px; background:#f7f8fa; text-align:center;
    color:#86909c; font-size:12px; position:relative;
  }
  .spec-table .row-num-cell .row-del {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:20px; height:20px; border-radius:4px;
    border:0; background:transparent; color:#c9cdd4;
    cursor:pointer; font-size:11px;
    display:none; align-items:center; justify-content:center;
    transition:.15s;
  }
  .spec-table tr:hover .row-num-cell .row-del { display:flex; }
  .spec-table .row-num-cell .row-del:hover { background:#fff0f0; color:#e54848; }
  .spec-table .row-num-cell .row-num-text { display:block; line-height:38px; }
  .spec-table tr:hover .row-num-cell .row-num-text { display:none; }

  /* 添加行按钮 */
  .spec-add-row-bar {
    flex-shrink:0; padding:8px; border-top:1px solid var(--border);
    display:flex; gap:8px; justify-content:center; background:#fafbfc;
  }
  .spec-add-row-btn {
    width:100%; height:34px;
    border:1px dashed #c9cdd4; border-radius:6px;
    background:#fff; color:#86909c;
    font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:4px;
    transition:.15s;
  }
  .spec-add-row-btn:hover { border-color:var(--blue); color:var(--blue); background:#f7f9ff; }

  /* 空状态 */
  .spec-empty {
    padding:40px 20px; text-align:center; color:#86909c; font-size:13px;
  }

  /* Token 弹窗 */
  .token-modal {
    position:fixed; inset:0; z-index:9999;
    background:rgba(0,0,0,.35); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
  }
  .token-modal-content {
    width:440px; background:#fff; border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    padding:24px;
  }
  .token-modal h4 { font-size:16px; font-weight:600; margin-bottom:8px; }
  .token-modal p { font-size:13px; color:#86909c; margin-bottom:16px; line-height:1.6; }
  .token-modal input {
    width:100%; height:38px; padding:0 12px;
    border:1px solid var(--border); border-radius:8px;
    font:13px "PingFang SC","Microsoft YaHei",sans-serif;
    outline:none; margin-bottom:16px;
  }
  .token-modal input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(51,112,255,.10); }
  .token-modal-actions { display:flex; gap:10px; justify-content:flex-end; align-items:center; }
  .token-modal-status {
    min-height:20px; margin:-6px 0 12px; font-size:12px; line-height:1.5;
    color:#86909c;
  }
  .token-modal-status.error { color:#e54848; }
  .token-modal-status.info { color:var(--blue); }
  .token-reset-btn { margin-right:auto; }
  .spec-btn:disabled { opacity:.65; cursor:not-allowed; }
  .token-link { color:var(--blue); font-size:12px; text-decoration:none; }
  .token-link:hover { text-decoration:underline; }

  /* Toast */
  .spec-toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    z-index:10000; padding:10px 20px; border-radius:8px;
    font-size:13px; color:#fff; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
    opacity:0; transition:opacity .25s ease, top .25s ease;
    pointer-events:none;
  }
  .spec-toast.show { opacity:1; top:30px; }
  .spec-toast.success { background:#00b894; }
  .spec-toast.error { background:#e54848; }
  .spec-toast.info { background:#3370ff; }

  @media (max-width:1099px) {
    .spec-panel { width:340px; flex-basis:340px; }
  }
  @media (max-width:899px) {
    .spec-panel { display:none; }
    .stage { flex-direction:column; }
  }
  @media (max-width:720px) {
    .layers { width:176px; flex-basis:176px; }
    .stage { padding:10px; gap:8px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 收起时的展开按钮 -->
  <button class="expand-btn" id="expandBtn" title="展开导航栏">☰</button>
  <aside class="layers" id="layers" aria-label="店雷达选品导航">
    <div class="layers-title">
      <div class="layers-title-left">
        <img src="logo.png" alt="店雷达选品">
        <span>店雷达选品</span>
      </div>
      <button class="toggle-btn" id="toggleBtn" title="收起导航栏">✕</button>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="layerSearch" type="search" placeholder="搜索版本或页面">
    </div>
    <nav class="layer-list">
            <!-- 版本规划 -->
      <div class="version-folder open" data-version="version-plan">
        <span class="folder-arrow">▶</span>
        <span>版本规划</span>
        <span class="version-badge" style="background:#f59e0b;">规划</span>
      </div>
      <div class="version-pages open" data-version="version-plan">
        <button class="layer-item" data-page="version-plan.html" data-search="版本规划"><span class="layer-icon icon-p" style="background:#f59e0b;">V</span>版本规划</button>
      </div>
      <!-- V2.9.3 版本（最新） -->
      <div class="version-folder open" data-version="v2.9.3">
        <span class="folder-arrow">▶</span>
        <span>V2.9.3</span>
        <span class="version-badge">最新</span>
      </div>
      <div class="version-pages open" data-version="v2.9.3">
        <button class="layer-item active" data-page="v2.9.3/search-agent.html" data-search="V2.9.3 创建图搜寻源 效果图 HTML CSS JS"><span class="layer-icon icon-p">C</span>创建图搜寻源</button>
        <button class="layer-item" data-page="v2.9.3/search-agent.html?page=list" data-search="V2.9.3 任务列表 效果图 HTML CSS JS"><span class="layer-icon icon-p" style="background:#ffa502;">L</span>任务列表</button>
        <button class="layer-item" data-page="v2.9.3/search-agent.html?page=result" data-search="V2.9.3 寻源结果 效果图 HTML CSS JS"><span class="layer-icon icon-p" style="background:#00b894;">R</span>寻源结果</button>
        <button class="layer-item" data-page="v2.9.3/search-agent.html?page=package" data-search="V2.9.3 套餐配置 效果图 HTML CSS JS"><span class="layer-icon icon-p" style="background:#3742fa;">P</span>套餐配置</button>
      </div>
      <!-- V2.8.9 版本 -->
      <div class="version-folder" data-version="v2.8.9">
        <span class="folder-arrow">▶</span>
        <span>V2.8.9</span>
      </div>
      <div class="version-pages" data-version="v2.8.9">
        <button class="layer-item" data-page="search-agent.html" data-search="V2.8.9 搜索智能体 效果图 HTML CSS JS MD 后端 JSON 映射"><span class="layer-icon icon-p">S</span>搜索智能体</button>
        <button class="layer-item" data-page="ai-output-interaction-viewer.html" data-search="V2.8.9 AI输出结果交互 效果图 HTML CSS JS MD 智能体提示词"><span class="layer-icon icon-p" style="background:#7c4dff;">AI</span>AI输出结果交互</button>
        <button class="layer-item" data-page="https://www.yuque.com/u26544515/sldqp9/xlf8hgmqhski5mfe?singleDoc#" data-search="V2.8.9 原型说明 版本规划 功能列表"><span class="layer-icon icon-p" style="background:#f59e0b;">P</span>原型说明</button>
        <button class="layer-item" data-page="backend-json-mapping-viewer.html" data-search="V2.8.9 后端对接文档 扣子智能体 API SSE Markdown 编辑 发布 导入"><span class="layer-icon icon-p" style="background:#10b981;">MD</span>后端对接文档</button>
      </div>
      <div class="layer-empty" id="layerEmpty">暂无匹配内容</div>
    </nav>
  </aside>
  <main class="stage">
    <div class="frame-shell"><iframe id="designFrame" src="v2.9.3/search-agent.html" title="设计页面预览"></iframe></div>
    <!-- 原型说明面板 -->
    <aside class="spec-panel" id="specPanel">
      <div class="spec-header">
        <div class="spec-header-left">
          <h3>原型说明</h3>
          <span class="spec-page-tag" id="specPageTag">创建图搜寻源</span>
        </div>
        <div class="spec-header-actions">
          <button class="spec-btn" id="addColBtn" title="新增列">+ 列</button>
          <button class="spec-btn" id="toggleSpecBtn" title="收起">▶</button>
          <button class="spec-btn success" id="deployBtn" title="更新到GitHub">↑ 更新</button>
        </div>
      </div>
      <div class="spec-table-wrap">
        <table class="spec-table" id="specTable">
          <thead id="specTableHead"></thead>
          <tbody id="specTableBody"></tbody>
        </table>
      </div>
      <div class="spec-add-row-bar">
        <button class="spec-add-row-btn" id="addRowBtn">+ 添加一行</button>
      </div>
    </aside>
  </main>
</div>
<!-- Token 弹窗 -->
<div class="token-modal" id="tokenModal" style="display:none;">
  <div class="token-modal-content">
    <h4>输入 GitHub Token</h4>
    <p>需要 Personal Access Token（需 repo 权限）才能更新到 GitHub。<br><a class="token-link" href="https://github.com/settings/tokens/new?scopes=repo&description=dianleida-deploy" target="_blank">点此创建 Token →</a></p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <div class="token-modal-status" id="tokenStatus" aria-live="polite"></div>
    <div class="token-modal-actions">
      <button class="spec-btn danger token-reset-btn" id="tokenResetBtn">清除已保存 Token</button>
      <button class="spec-btn" id="tokenCancelBtn">取消</button>
      <button class="spec-btn primary" id="tokenConfirmBtn">确认并提交</button>
    </div>
  </div>
</div>
<!-- Toast -->
<div class="spec-toast" id="specToast"></div>
<script>
  const frame = document.getElementById('designFrame');
  const items = Array.from(document.querySelectorAll('.layer-item'));
  const layerSearch = document.getElementById('layerSearch');
  const layerEmpty = document.getElementById('layerEmpty');
  const layers = document.getElementById('layers');
  const toggleBtn = document.getElementById('toggleBtn');
  const expandBtn = document.getElementById('expandBtn');
  const versionFolders = Array.from(document.querySelectorAll('.version-folder'));
  const versionPages = Array.from(document.querySelectorAll('.version-pages'));
  // ===== 侧边栏展开/收起 =====
  function toggleSidebar(show) {
    if (show) {
      layers.classList.remove('collapsed');
      expandBtn.classList.remove('show');
      localStorage.setItem('sidebar-collapsed', 'false');
    } else {
      layers.classList.add('collapsed');
      expandBtn.classList.add('show');
      localStorage.setItem('sidebar-collapsed', 'true');
    }
  }
  toggleBtn.addEventListener('click', () => toggleSidebar(false));
  expandBtn.addEventListener('click', () => toggleSidebar(true));
  // ===== 版本文件夹展开/收起 =====
  function toggleVersion(version, open) {
    const folder = document.querySelector('.version-folder[data-version="' + version + '"]');
    const pages = document.querySelector('.version-pages[data-version="' + version + '"]');
    if (!folder || !pages) return;
    if (open) {
      folder.classList.add('open');
      pages.classList.add('open');
    } else {
      folder.classList.remove('open');
      pages.classList.remove('open');
    }
  }
  versionFolders.forEach(folder => {
    folder.addEventListener('click', () => {
      const version = folder.dataset.version;
      const isOpen = folder.classList.contains('open');
      toggleVersion(version, !isOpen);
    });
  });
  // ===== 页面切换 =====
  const INNER_PAGE_VERSION = 'module-spec-nav-fixed-20260807';
  function withVersion(url) {
    if (!url.includes('v2.9.3/search-agent.html')) return url;
    return url + (url.includes('?') ? '&' : '?') + 'v=' + INNER_PAGE_VERSION;
  }
  items.forEach(item => item.addEventListener('click', () => {
    const target = item.dataset.page || '';
    if (target.startsWith('http://') || target.startsWith('https://')) {
      window.location.href = target;
      return;
    }
    items.forEach(node => node.classList.remove('active'));
    item.classList.add('active');
    frame.src = withVersion(target);
    if (typeof updateCurrentPageKey === 'function') updateCurrentPageKey(target);
  }));
  // ===== 监听 iframe 内部板块切换（postMessage）=====
  // 当 iframe 内部调用 switchPage 时，同步侧边栏选中状态（不刷新 iframe）
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'pageChange') return;
    const page = e.data.page;
    if (!page) return;
      if (page.startsWith("http")) { window.location.href = page; return; }
    // 在 V2.9.3 版本组中查找匹配的导航项
    const v293Items = items.filter(item => {
      const dp = item.dataset.page || '';
      return dp.includes('v2.9.3/search-agent.html');
    });
    let targetItem = null;
    v293Items.forEach(item => {
      const dp = item.dataset.page || '';
      if (page === 'create' && !dp.includes('page=')) {
        targetItem = item;
      } else if (dp.includes('page=' + page)) {
        targetItem = item;
      }
    });
    if (targetItem) {
      v293Items.forEach(node => node.classList.remove('active'));
      targetItem.classList.add('active');
      // 不刷新 iframe，内容已在内部切换
    }
  });
  // ===== 搜索 =====
  layerSearch.addEventListener('input', () => {
    const keyword = layerSearch.value.trim().toLowerCase();
    let visibleCount = 0;
    // 搜索时展开所有版本
    const isSearching = !!keyword;
    versionFolders.forEach(folder => {
      const version = folder.dataset.version;
      const pages = document.querySelector('.version-pages[data-version="' + version + '"]');
      const versionMatched = version.includes(keyword);
      if (isSearching) {
        folder.classList.add('open');
        pages.classList.add('open');
      } else {
        // 非搜索状态下，V2.9.3 默认展开
        if (version === 'v2.9.3' || version === 'version-plan') {
          folder.classList.add('open');
          pages.classList.add('open');
        } else {
          folder.classList.remove('open');
          pages.classList.remove('open');
        }
      }
    });
    items.forEach(item => {
      const text = (item.dataset.search || item.textContent).toLowerCase();
      const matched = !keyword || text.includes(keyword);
      item.style.display = matched ? 'flex' : 'none';
      if (matched) visibleCount += 1;
    });
    layerEmpty.style.display = visibleCount > 0 ? 'none' : 'block';
  });
  // ===== 初始化：每次进入页面默认展开左侧导航 =====
  toggleSidebar(true);

  // ===== 原型说明：可编辑动态表格 =====
  const GITHUB_OWNER = 'kingf668877-creator';
  const GITHUB_REPO = 'dianleida1688';
  const GITHUB_BRANCH = 'master';
  const SPEC_FILE_PATHS = {
    '创建图搜寻源': 'v6/v2.9.3/prototype-spec-create.json',
    '任务列表': 'v6/v2.9.3/prototype-spec-list.json',
    '寻源结果': 'v6/v2.9.3/prototype-spec-result.json',
    '套餐配置': 'v6/v2.9.3/prototype-spec-package.json',
    '版本规划': 'v6/v2.9.3/prototype-spec-version-plan.json'
  };
  const LEGACY_SPEC_FILE_PATH = 'v6/v2.9.3/prototype-spec.json';

  // 页面名称映射
  const pageNames = {
    'v2.9.3/search-agent.html': '创建图搜寻源',
    'v2.9.3/search-agent.html?page=list': '任务列表',
    'v2.9.3/search-agent.html?page=result': '寻源结果',
    'v2.9.3/search-agent.html?page=package': '套餐配置',
    'version-plan.html': '版本规划'
  };

  // 默认列
  const defaultColumns = ['功能模块', '功能描述', '交互说明', '数据来源', '备注'];

  // 每个页面的默认数据
  const defaultPageData = {
    '创建图搜寻源': [
      { '功能模块': '任务名称', '功能描述': '输入任务名称', '交互说明': '文本输入框，必填', '数据来源': '用户输入', '备注': '用于后续查找' },
      { '功能模块': '图搜方式', '功能描述': '选择图搜方式', '交互说明': 'Tab切换：图片链接/文件上传/上传图片', '数据来源': '用户选择', '备注': '支持3种方式' },
      { '功能模块': '图片链接', '功能描述': '批量粘贴图片URL', '交互说明': 'textarea输入，最多1000条', '数据来源': '用户输入', '备注': '自动解析有效链接' },
      { '功能模块': '文件上传', '功能描述': '上传xlsx/xls文件', '交互说明': '拖拽或点击上传', '数据来源': '用户上传', '备注': '需下载模板' },
      { '功能模块': '上传图片', '功能描述': '直接上传图片', '交互说明': '点击上传，最多1000张', '数据来源': '用户上传', '备注': '支持多选' },
      { '功能模块': '张数统计', '功能描述': '显示已上传/预计扣除/剩余', '交互说明': '实时更新统计', '数据来源': '系统计算', '备注': '超出时显示增购' },
      { '功能模块': '开始寻源', '功能描述': '提交任务', '交互说明': '校验后创建任务', '数据来源': '系统提交', '备注': '按钮文字为"开始寻源"' }
    ],
    '任务列表': [
      { '功能模块': '功能横幅', '功能描述': '展示任务统计和创建入口', '交互说明': '点击创建跳转', '数据来源': '系统数据', '备注': '' },
      { '功能模块': '剩余张数', '功能描述': '显示当前剩余张数', '交互说明': '点击增购弹窗', '数据来源': '系统数据', '备注': '' },
      { '功能模块': '筛选区', '功能描述': '按名称/方式/状态/时间筛选', '交互说明': '多条件组合查询', '数据来源': '用户输入', '备注': '' },
      { '功能模块': '任务表格', '功能描述': '展示任务列表', '交互说明': '状态对应操作按钮', '数据来源': '系统数据', '备注': '分页展示' },
      { '功能模块': '操作按钮', '功能描述': '任务操作', '交互说明': '按状态映射不同操作', '数据来源': '系统', '备注': '竖线分隔' }
    ],
    '寻源结果': [
      { '功能模块': '图源信息', '功能描述': '展示搜索图源', '交互说明': '显示任务名/方式/数量', '数据来源': '系统数据', '备注': '' },
      { '功能模块': '状态筛选', '功能描述': '全部/成功/失败', '交互说明': 'Tab切换筛选', '数据来源': '系统计算', '备注': '' },
      { '功能模块': '筛选条件', '功能描述': '价格/销量/揽收率等', '交互说明': '可收起展开', '数据来源': '用户输入', '备注': '' },
      { '功能模块': '结果卡片', '功能描述': '垂直卡片展示商品', '交互说明': '图片+状态+相似度+价格+数据', '数据来源': '1688API', '备注': '4列响应式' },
      { '功能模块': '批量操作', '功能描述': '监控/关注/导出/铺货', '交互说明': '全选后批量操作', '数据来源': '系统', '备注': '' }
        ],
    '版本规划': [
      { '功能模块': 'V2.9.3', '功能描述': '图搜寻源产品迭代', '交互说明': '创建图搜寻源/任务列表/寻源结果/套餐配置', '数据来源': '产品功能规划', '备注': '已完成' },
      { '功能模块': 'V3.0.0', '功能描述': '多平台', '交互说明': '支持1688/Ozon/TEMU等多平台图搜', '数据来源': '产品功能规划', '备注': '规划中' },
      { '功能模块': 'V3.1.0', '功能描述': 'AI智能选品', '交互说明': '基于寻源结果AI推荐优质商品', '数据来源': '产品功能规划', '备注': '规划中' },
      { '功能模块': 'V3.2.0', '功能描述': '批量铺货管理', '交互说明': '一键多平台', '数据来源': '产品功能规划', '备注': '规划中' }
    ]
  };

  let currentPageKey = '创建图搜寻源';
  let activeSpecData = null;
  let specLoadToken = 0;

  // ===== Toast =====
  const specToastEl = document.getElementById('specToast');
  let specToastTimer;
  function specToast(msg, type) {
    specToastEl.textContent = msg;
    specToastEl.className = 'spec-toast show ' + (type || 'info');
    clearTimeout(specToastTimer);
    specToastTimer = setTimeout(() => {
      specToastEl.className = 'spec-toast ' + (type || 'info');
    }, 2200);
  }

  // ===== 加载/保存数据：每个模块独立 =====
  function getSpecStorageKey(pageName = currentPageKey) { return "dianleida-spec-data-" + encodeURIComponent(pageName); }
  function saveSpecData() {
    if (!activeSpecData) return;
    localStorage.setItem(getSpecStorageKey(), JSON.stringify(activeSpecData));
  }

  function decodeGithubContent(encoded) {
    const binary = atob((encoded || '').replace(/\s/g, ''));
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  async function loadSpecRemote(pageName) {
    const token = ++specLoadToken;
    const path = getSpecFilePath(pageName);
    try {
      const resp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`, { headers: { "Accept": "application/vnd.github+json" } });
      if (!resp.ok) return false;
      const data = await resp.json();
      const parsed = JSON.parse(decodeGithubContent(data.content));
      if (token !== specLoadToken || pageName !== currentPageKey) return false;
      if (parsed && Array.isArray(parsed.columns) && Array.isArray(parsed.rows)) {
        activeSpecData = parsed;
        specFileCache[pageName] = { sha: data.sha, path };
        return true;
      }
    } catch (e) { console.warn("加载独立原型说明失败", pageName, e); }
    return false;
  }

  async function loadSpecData() {
    const pageName = currentPageKey;
    const saved = localStorage.getItem(getSpecStorageKey(pageName));
    if (saved) {
      try { activeSpecData = JSON.parse(saved) || null; } catch(e) { activeSpecData = null; }
    }
    if (!activeSpecData) {
      activeSpecData = { columns: [...defaultColumns], rows: defaultPageData[pageName] ? [...defaultPageData[pageName]] : [] };
    }
    renderSpecTable();
    await loadSpecRemote(pageName);
    if (pageName === currentPageKey) { saveSpecData(); renderSpecTable(); }
  }  // ===== 渲染表格 =====
  function renderSpecTable() {
    const pageData = activeSpecData;
    if (!pageData) return;
    const head = document.getElementById('specTableHead');
    const body = document.getElementById('specTableBody');
    const tag = document.getElementById('specPageTag');
    tag.textContent = currentPageKey;

    // 表头
    let headHtml = '<tr><th class="row-num-cell" style="width:36px;">#</th>';
    pageData.columns.forEach((col, ci) => {
      headHtml += `<th style="min-width:100px;"><div class="th-content">
        <span class="th-text" contenteditable="true" data-col="${ci}" spellcheck="false">${escapeHtml(col)}</span>
        ${pageData.columns.length > 1 ? `<button class="th-del" data-col="${ci}" title="删除列">✕</button>` : ''}
      </div></th>`;
    });
    headHtml += '</tr>';
    head.innerHTML = headHtml;

    // 表体
    if (pageData.rows.length === 0) {
      body.innerHTML = `<tr><td colspan="${pageData.columns.length + 1}" class="spec-empty">点击下方"添加一行"开始编辑原型说明</td></tr>`;
    } else {
      let bodyHtml = '';
      pageData.rows.forEach((row, ri) => {
        bodyHtml += `<tr><td class="row-num-cell"><span class="row-num-text">${ri + 1}</span><button class="row-del" data-row="${ri}" title="删除行">✕</button></td>`;
        pageData.columns.forEach((col, ci) => {
          const val = row[col] || '';
          bodyHtml += `<td><div class="cell-edit" contenteditable="true" data-row="${ri}" data-col="${ci}" data-key="${escapeHtml(col)}" data-placeholder="点击编辑" spellcheck="false">${escapeHtml(val)}</div></td>`;
        });
        bodyHtml += '</tr>';
      });
      body.innerHTML = bodyHtml;
    }

    bindTableEvents();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== 绑定表格事件 =====
  function bindTableEvents() {
    // 单元格编辑
    document.querySelectorAll('.cell-edit').forEach(cell => {
      cell.addEventListener('blur', () => {
        const ri = parseInt(cell.dataset.row);
        const ci = parseInt(cell.dataset.col);
        const colName = activeSpecData.columns[ci];
        if (!activeSpecData.rows[ri]) return;
        activeSpecData.rows[ri][colName] = cell.textContent;
        saveSpecData();
      });
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          cell.blur();
        }
      });
    });

    // 表头编辑
    document.querySelectorAll('.th-text').forEach(th => {
      th.addEventListener('blur', () => {
        const ci = parseInt(th.dataset.col);
        const oldName = activeSpecData.columns[ci];
        const newName = th.textContent.trim() || oldName;
        if (newName !== oldName) {
          // 更新列名，同步所有行数据
          activeSpecData.columns[ci] = newName;
          activeSpecData.rows.forEach(row => {
            if (oldName in row) {
              row[newName] = row[oldName];
              delete row[oldName];
            }
          });
          th.textContent = newName;
          saveSpecData();
        }
      });
      th.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); th.blur(); }
      });
    });

    // 删除列
    document.querySelectorAll('.th-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const ci = parseInt(btn.dataset.col);
        const colName = activeSpecData.columns[ci];
        if (!confirm(`确认删除列"${colName}"？`)) return;
        activeSpecData.columns.splice(ci, 1);
        activeSpecData.rows.forEach(row => { delete row[colName]; });
        saveSpecData();
        renderSpecTable();
      });
    });

    // 删除行
    document.querySelectorAll('.row-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const ri = parseInt(btn.dataset.row);
        activeSpecData.rows.splice(ri, 1);
        saveSpecData();
        renderSpecTable();
      });
    });
  }

  // ===== 添加行/列 =====
  document.getElementById('addRowBtn').addEventListener('click', () => {
    const pageData = activeSpecData;
    const newRow = {};
    pageData.columns.forEach(col => { newRow[col] = ''; });
    pageData.rows.push(newRow);
    saveSpecData();
    renderSpecTable();
    // 滚动到底部
    const wrap = document.querySelector('.spec-table-wrap');
    wrap.scrollTop = wrap.scrollHeight;
    // 聚焦新行的第一个单元格
    setTimeout(() => {
      const cells = document.querySelectorAll('.cell-edit');
      if (cells.length > 0) {
        const lastCell = cells[cells.length - 1];
        lastCell.focus();
      }
    }, 50);
  });

  document.getElementById('addColBtn').addEventListener('click', () => {
    const pageData = activeSpecData;
    const colName = '新列' + (pageData.columns.length + 1);
    pageData.columns.push(colName);
    pageData.rows.forEach(row => { row[colName] = ''; });
    saveSpecData();
    renderSpecTable();
    // 滚动到右侧
    const wrap = document.querySelector('.spec-table-wrap');
    wrap.scrollLeft = wrap.scrollWidth;
    // 聚焦新列表头
    setTimeout(() => {
      const ths = document.querySelectorAll('.th-text');
      if (ths.length > 0) {
        ths[ths.length - 1].focus();
        // 全选文字
        const range = document.createRange();
        range.selectNodeContents(ths[ths.length - 1]);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }, 50);
  });

  // ===== 收起/展开面板 =====
  const specPanel = document.getElementById('specPanel');
  const toggleSpecBtn = document.getElementById('toggleSpecBtn');
  toggleSpecBtn.addEventListener('click', () => {
    specPanel.classList.toggle('collapsed');
    toggleSpecBtn.textContent = specPanel.classList.contains('collapsed') ? '◀' : '▶';
    localStorage.setItem('spec-panel-collapsed', specPanel.classList.contains('collapsed'));
  });
  if (localStorage.getItem('spec-panel-collapsed') === 'true') {
    specPanel.classList.add('collapsed');
    toggleSpecBtn.textContent = '◀';
  }

  // ===== 页面切换时更新原型说明 =====
  async function updateCurrentPageKey(pageUrl) {
    const pageName = pageNames[pageUrl] || '创建图搜寻源';
    currentPageKey = pageName;
    activeSpecData = null;
    await loadSpecData();
  }

  // 左侧导航切换时同步当前模块，所有数据只属于当前模块
  document.querySelectorAll('.layer-item[data-page]').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      if (!page) return;
      if (page.startsWith("http")) { window.location.href = page; return; }
      const pageUrl = page === 'create' ? 'v2.9.3/search-agent.html' : page === 'version-plan.html' ? 'version-plan.html' : `v2.9.3/search-agent.html?page=${page}`;
      updateCurrentPageKey(pageUrl);
    });
  });
  // ===== GitHub 部署 =====
  const deployBtn = document.getElementById('deployBtn');
  const tokenModal = document.getElementById('tokenModal');
  const tokenInput = document.getElementById('tokenInput');
  const tokenStatus = document.getElementById('tokenStatus');
  const tokenCancelBtn = document.getElementById('tokenCancelBtn');
  const tokenConfirmBtn = document.getElementById('tokenConfirmBtn');
  const tokenResetBtn = document.getElementById('tokenResetBtn');

  function openTokenModal(message) {
    tokenStatus.textContent = message || '';
    tokenStatus.className = 'token-modal-status' + (message ? ' info' : '');
    tokenConfirmBtn.textContent = '确认并提交';
    tokenConfirmBtn.disabled = false;
    tokenCancelBtn.disabled = false;
    tokenInput.disabled = false;
    tokenModal.style.display = 'flex';
    setTimeout(() => tokenInput.focus(), 0);
  }

  deployBtn.addEventListener('click', async () => {
    const token = localStorage.getItem('dianleida-github-token');
    if (!token) {
      openTokenModal('Token 只保存在当前浏览器，用于本次及后续提交。');
    } else {
      await deployToGitHub(token);
    }
  });

  tokenCancelBtn.addEventListener('click', () => {
    tokenModal.style.display = 'none';
    tokenStatus.textContent = '';
  });

  tokenResetBtn.addEventListener('click', () => {
    localStorage.removeItem('dianleida-github-token');
    tokenInput.value = '';
    tokenStatus.textContent = '已清除，请输入新的 Token。';
    tokenStatus.className = 'token-modal-status info';
    tokenInput.focus();
  });

  tokenInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !tokenConfirmBtn.disabled) tokenConfirmBtn.click();
  });

  tokenConfirmBtn.addEventListener('click', async () => {
    const token = tokenInput.value.trim();
    if (!token) {
      tokenStatus.textContent = '请输入 GitHub Token 后再提交。';
      tokenStatus.className = 'token-modal-status error';
      tokenInput.focus();
      return;
    }

    tokenConfirmBtn.textContent = '正在提交...';
    tokenConfirmBtn.disabled = true;
    tokenCancelBtn.disabled = true;
    tokenInput.disabled = true;
    tokenStatus.textContent = '正在连接 GitHub，请稍候...';
    tokenStatus.className = 'token-modal-status info';
    localStorage.setItem('dianleida-github-token', token);

    const result = await deployToGitHub(token, true);
    if (result.ok) {
      tokenModal.style.display = 'none';
      tokenInput.value = '';
    } else {
      tokenStatus.textContent = result.message + '。请检查 Token 权限，或清除后重新输入。';
      tokenStatus.className = 'token-modal-status error';
      tokenConfirmBtn.textContent = '重新提交';
      tokenConfirmBtn.disabled = false;
      tokenCancelBtn.disabled = false;
      tokenInput.disabled = false;
      tokenInput.select();
    }
  });

  async function deployToGitHub(token, keepModalOpen) {
    deployBtn.textContent = '更新中...';
    deployBtn.disabled = true;
    specToast('正在更新当前模块到 GitHub...', 'info');
    try {
      const content = JSON.stringify(activeSpecData || { columns: [...defaultColumns], rows: [] }, null, 2);
      const b64 = btoa(unescape(encodeURIComponent(content)));
      const specPath = getSpecFilePath(currentPageKey);
      let sha = specFileCache[currentPageKey]?.sha || null;
      if (!sha) {
        const getResp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${specPath}?ref=${GITHUB_BRANCH}`, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
        if (getResp.ok) sha = (await getResp.json()).sha;
        else if (getResp.status !== 404) throw new Error(`GitHub 验证失败（${getResp.status}）`);
      }
      const body = { message: `docs: update prototype spec for ${currentPageKey}`, content: b64, branch: GITHUB_BRANCH };
      if (sha) body.sha = sha;
      const resp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${specPath}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.message || `GitHub 提交失败（${resp.status}）`); }
      const saved = await resp.json();
      specFileCache[currentPageKey] = { sha: saved.content?.sha || saved.commit?.sha, path: specPath };
      specToast(`“${currentPageKey}”原型说明更新成功。`, 'success');
      return { ok: true, message: '更新成功' };
    } catch(err) {
      const message = err.message === 'Bad credentials' ? 'Token 无效或已过期' : err.message;
      specToast('更新失败：' + message, 'error');
      if (!keepModalOpen) { openTokenModal(message + '，请重新输入 Token。'); tokenStatus.className = 'token-modal-status error'; localStorage.removeItem('dianleida-github-token'); }
      return { ok: false, message };
    } finally { deployBtn.textContent = '↑ 更新'; deployBtn.disabled = false; }
  }
  // ===== 初始化 =====
  loadSpecData();
  renderSpecTable();
</script>
