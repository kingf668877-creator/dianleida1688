<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店雷达 - 开发模式</title>
  <link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --blue:#3370ff; --border:#e5e6eb; --text:#1d2129; --muted:#86909c; --hover:#f2f3f5; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#f5f6f8; }
  .app { display:flex; width:100%; height:100vh; }
  .layers {
    width:224px; flex:0 0 224px;
    background:#fff; border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition: width .25s ease, flex-basis .25s ease;
    overflow:hidden;
  }
  .layers.collapsed { width:0; flex-basis:0; border-right:0; }
  .layers-title {
    height:52px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:0 16px; border-bottom:1px solid var(--border);
    font-size:15px; font-weight:600; flex-shrink:0;
  }
  .layers-title-left { display:flex; align-items:center; gap:10px; min-width:0; }
  .layers-title img { width:28px; height:28px; border-radius:6px; flex:0 0 28px; }
  .layers-title span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toggle-btn {
    width:28px; height:28px; flex-shrink:0;
    border:0; border-radius:6px;
    background:transparent; color:#86909c;
    cursor:pointer; font-size:14px;
    display:grid; place-items:center;
    transition:.15s;
  }
  .toggle-btn:hover { background:var(--hover); color:var(--text); }
  .search-wrap { padding:10px 12px 0; flex-shrink:0; }
  .search-input {
    width:100%; height:34px; padding:0 12px;
    border:1px solid var(--border); border-radius:8px;
    color:#1d2129; outline:none;
    font:13px/1 "PingFang SC","Microsoft YaHei",sans-serif;
  }
  .search-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(51,112,255,.10); }
  .search-input::placeholder { color:#a8abb2; }
  .layer-list { padding:10px 8px; flex:1; overflow-y:auto; }
  .version-folder {
    width:100%; height:34px; padding:0 10px;
    border:0; border-radius:6px; background:transparent;
    color:#4e5969; display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; text-align:left;
    cursor:pointer; transition:.15s;
  }
  .version-folder:hover { background:var(--hover); }
  .version-folder .folder-arrow {
    width:14px; display:inline-block;
    transition: transform .2s ease;
    font-size:10px; color:#86909c;
  }
  .version-folder.open .folder-arrow { transform: rotate(90deg); }
  .version-badge {
    margin-left:auto;
    font-size:10px; font-weight:500;
    padding:2px 6px; border-radius:4px;
    background:#e8f0ff; color:var(--blue);
  }
  .version-pages { padding:4px 0 0 22px; display:none; }
  .version-pages.open { display:block; }
  .layer-empty { display:none; padding:18px 12px; color:#a8abb2; font-size:12px; text-align:center; }
  .layer-item {
    width:100%; height:42px; padding:0 12px;
    border:0; border-radius:6px; background:transparent;
    color:#4e5969; display:flex; align-items:center; gap:10px;
    font-size:13px; cursor:pointer; text-align:left;
    transition:.16s ease;
  }
  .layer-item:hover { background:var(--hover); color:var(--text); }
  .layer-item.active { color:var(--blue); background:#e8f0ff; font-weight:500; }
  .layer-icon {
    width:22px; height:22px; border-radius:5px;
    display:grid; place-items:center;
    color:#fff; font-size:11px; font-weight:700;
  }
  .icon-p { background:#ff6b6b; }
  .stage { min-width:0; flex:1; height:100%; background:#eef0f3; padding:20px; position:relative; display:flex; gap:16px; }
  .frame-shell { flex:1; min-width:0; height:100%; overflow:hidden; background:#fff; border:1px solid #dfe1e5; border-radius:8px; box-shadow:0 8px 24px rgba(29,33,41,.08); position:relative; }
  iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
  .expand-btn {
    position:fixed; top:12px; left:12px; z-index:100;
    width:40px; height:40px;
    border:1px solid var(--border); border-radius:10px;
    background:#fff; color:#4e5969;
    cursor:pointer; font-size:16px;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:.15s;
  }
  .expand-btn:hover { background:var(--hover); color:var(--text); }
  .expand-btn.show { display:flex; }

  .spec-panel {
    width:380px; flex:0 0 380px;
    height:100%; background:#fff;
    border:1px solid #dfe1e5; border-radius:8px;
    box-shadow:0 8px 24px rgba(29,33,41,.08);
    display:flex; flex-direction:column;
    transition: width .25s ease, flex-basis .25s ease, opacity .25s ease;
    overflow:hidden;
  }
  .spec-panel.collapsed { width:0; flex-basis:0; opacity:0; border:0; }
  .spec-header {
    height:52px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--border);
    background:#fafbfc;
  }
  .spec-header-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .spec-header h3 { font-size:15px; font-weight:600; white-space:nowrap; }
  .spec-title-link { color:inherit; text-decoration:none; cursor:pointer; }
  .spec-title-link:hover { color:var(--blue); }
  .spec-page-tag {
    font-size:11px; padding:2px 8px; border-radius:4px;
    background:#e8f0ff; color:var(--blue); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;
  }
  .spec-header-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .spec-btn {
    height:30px; padding:0 12px;
    border:1px solid var(--border); border-radius:6px;
    background:#fff; color:#4e5969;
    font-size:12px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    transition:.15s; white-space:nowrap;
  }
  .spec-btn:hover { background:var(--hover); color:var(--text); }

  .spec-yuque-wrap {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 24px; gap:20px;
  }
  .spec-yuque-info { font-size:13px; color:#86909c; text-align:center; margin:0; }
  .spec-yuque-link {
    display:inline-flex; align-items:center; gap:6px;
    padding:12px 24px; border-radius:8px;
    background:linear-gradient(135deg, #3370ff, #5b47fb);
    color:#fff; font-size:14px; font-weight:600;
    text-decoration:none; transition:.2s;
    box-shadow:0 4px 16px rgba(51,112,255,.3);
  }
  .spec-yuque-link:hover {
    transform:translateY(-1px);
    box-shadow:0 6px 24px rgba(51,112,255,.4);
  }

  /* 顶部展开按钮：默认显示 */
  .expand-spec-btn {
    position:absolute; top:14px; right:14px; z-index:30;
    height:30px; padding:0 12px;
    border:1px solid var(--border); border-radius:6px;
    background:rgba(255,255,255,.95); color:#4e5969;
    font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    transition:.15s;
  }
  .expand-spec-btn:hover { background:var(--hover); color:var(--text); }
  .expand-spec-btn::before { content:""; width:14px; height:14px; background:linear-gradient(135deg,#3370ff,#5b47fb); border-radius:3px; }

  /* 当前页面短链展示 */
  .share-link {
    position:absolute; right:18px; top:60px; z-index:25;
    width:320px; padding:12px;
    background:rgba(255,255,255,.94);
    border:1px solid var(--border); border-radius:10px;
    box-shadow:0 8px 24px rgba(29,33,41,.08);
  }
  .share-link-title {
    font-size:12px; font-weight:600; color:#4e5969;
    margin-bottom:8px;
  }
  .share-link-row { display:flex; gap:6px; }
  .share-link-input {
    flex:1; min-width:0; height:32px; padding:0 10px;
    font:12px Consolas, "Microsoft YaHei", monospace;
    color:#1d2129; background:#fafbfc;
    border:1px solid var(--border); border-radius:6px;
    outline:none;
  }
  .share-link-input:focus { border-color:var(--blue); background:#fff; }
  .share-link-copy {
    height:32px; padding:0 12px;
    border:0; border-radius:6px;
    background:var(--blue); color:#fff;
    font-size:12px; font-weight:600; cursor:pointer;
    transition:.15s;
  }
  .share-link-copy:hover { background:#2860d9; }
  .share-link-copy.ok { background:#16a36a; }
  .share-link-hint {
    margin-top:8px; font-size:11px; color:#86909c; line-height:1.5;
  }
  .share-link-modes {
    display:flex; gap:4px; margin-top:8px;
  }
  .share-link-mode {
    flex:1; height:24px; padding:0 8px;
    border:1px solid var(--border); border-radius:4px;
    background:#fff; color:#86909c;
    font-size:11px; font-weight:600; cursor:pointer;
    transition:.12s;
  }
  .share-link-mode:hover { color:var(--text); border-color:var(--blue); }
  .share-link-mode.active {
    background:var(--blue); border-color:var(--blue); color:#fff;
  }

  @media (max-width:1099px) { .spec-panel { width:300px; flex-basis:300px; } }
  @media (max-width:899px) { .spec-panel { display:none; } .stage { flex-direction:column; } }
  @media (max-width:720px) { .layers { width:176px; flex-basis:176px; } .stage { padding:10px; gap:8px; } }
</style>
</head>

<script>
  const frame = document.getElementById('designFrame');
  const items = Array.from(document.querySelectorAll('.layer-item'));
  const layerSearch = document.getElementById('layerSearch');
  const layerEmpty = document.getElementById('layerEmpty');
  const layers = document.getElementById('layers');
  const toggleBtn = document.getElementById('toggleBtn');
  const expandBtn = document.getElementById('expandBtn');
  const versionFolders = Array.from(document.querySelectorAll('.version-folder'));
  const versionPages = Array.from(document.querySelectorAll('.version-pages'));
  const specPanel = document.getElementById('specPanel');
  const toggleSpecBtn = document.getElementById('toggleSpecBtn');
  const expandSpecBtn = document.getElementById('expandSpecBtn');

  function toggleSidebar(show) {
    if (show) {
      layers.classList.remove('collapsed');
      expandBtn.classList.remove('show');
      localStorage.setItem('sidebar-collapsed', 'false');
    } else {
      layers.classList.add('collapsed');
      expandBtn.classList.add('show');
      localStorage.setItem('sidebar-collapsed', 'true');
    }
  }
  toggleBtn.addEventListener('click', () => toggleSidebar(false));
  expandBtn.addEventListener('click', () => toggleSidebar(true));

  function toggleSpecPanel(show) {
    if (show) {
      specPanel.classList.remove('collapsed');
      expandSpecBtn.style.display = 'none';
      localStorage.setItem('spec-panel-collapsed', 'false');
    } else {
      specPanel.classList.add('collapsed');
      expandSpecBtn.style.display = 'inline-flex';
      localStorage.setItem('spec-panel-collapsed', 'true');
    }
  }
  toggleSpecBtn.addEventListener('click', () => toggleSpecPanel(false));
  expandSpecBtn.addEventListener('click', () => toggleSpecPanel(true));

  function toggleVersion(version, open) {
    const folder = document.querySelector('.version-folder[data-version="' + version + '"]');
    const pages = document.querySelector('.version-pages[data-version="' + version + '"]');
    if (!folder || !pages) return;
    if (open) {
      folder.classList.add('open');
      pages.classList.add('open');
    } else {
      folder.classList.remove('open');
      pages.classList.remove('open');
    }
  }
  versionFolders.forEach(folder => {
    folder.addEventListener('click', () => {
      const version = folder.dataset.version;
      const isOpen = folder.classList.contains('open');
      toggleVersion(version, !isOpen);
    });
  });

  // ===== 页面切换 =====
  const INNER_PAGE_VERSION = '2026081810';
  const VERSIONED_PATHS = [
    'v2.9.3/search-agent-yuque.html',
    'v2.9.5/v2-upgrade-v3-plugin-update.html',
    'v2.9.5/v3-upgrade-v3-plugin-update.html'
  ];
  function withVersion(url) {
    if (!url) return url;
    if (!VERSIONED_PATHS.some(prefix => url.startsWith(prefix))) return url;
    const sep = url.includes('?') ? '&' : '?';
    return url + sep + 'v=' + INNER_PAGE_VERSION;
  }

  // ===== 路由：URL ?route=<path>，把 path 映射到导航项 =====
  const shareLinkInput = document.getElementById('shareLinkInput');
  const shareLinkCopy = document.getElementById('shareLinkCopy');
  const shareLinkHint = document.getElementById('shareLinkHint');
  function getRouteFromUrl() {
    try {
      const url = new URL(window.location.href);
      const raw = (url.searchParams.get('route') || '').trim();
      return raw || null;
    } catch (e) { return null; }
  }
  function setUrlRoute(route) {
    try {
      const url = new URL(window.location.href);
      if (route) url.searchParams.set('route', route);
      else url.searchParams.delete('route');
      history.replaceState(null, '', url);
    } catch (e) {}
  }
  function routeFromPagePath(pagePath) {
    return (pagePath || '').split('?')[0];
  }
  function findItemByRoute(route) {
    if (!route) return null;
    return items.find(item => routeFromPagePath(item.dataset.page || '') === route) || null;
  }
  function buildShareUrl(route) {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('route', route);
      url.searchParams.delete('v');
      return url.toString();
    } catch (e) {
      return window.location.href;
    }
  }
  function buildRouteOnly(route) {
    return '?route=' + route;
  }
  function buildTinyUrl(route) {
    return 'dld/' + route;
  }
  function currentShareMode() {
    const btn = document.querySelector('.share-link-mode.active');
    return btn ? btn.dataset.mode : 'tiny';
  }
  function refreshShareLink(route) {
    if (!shareLinkInput) return;
    if (!route) {
      shareLinkInput.value = '';
      return;
    }
    const mode = currentShareMode();
    if (mode === 'route') shareLinkInput.value = buildRouteOnly(route);
    else if (mode === 'full') shareLinkInput.value = buildShareUrl(route);
    else shareLinkInput.value = buildTinyUrl(route);
  }

  function activateItem(item, shouldSyncUrl) {
    if (!item) return;
    const target = item.dataset.page || '';
    items.forEach(node => node.classList.remove('active'));
    item.classList.add('active');
    frame.src = withVersion(target);
    if (typeof updateCurrentPageKey === 'function') updateCurrentPageKey(target);
    if (shouldSyncUrl !== false) {
      const route = routeFromPagePath(target);
      setUrlRoute(route);
      refreshShareLink(route);
    }
  }

  items.forEach(item => item.addEventListener('click', () => {
    const target = item.dataset.page || '';
    if (target.startsWith('http://') || target.startsWith('https://')) {
      window.location.href = target;
      return;
    }
    activateItem(item);
  }));
  // ===== 监听 iframe 内部板块切换（postMessage）=====
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'pageChange') return;
    const page = e.data.page;
    if (!page) return;
    if (page.startsWith('http')) { window.location.href = page; return; }
    const matchList = items.filter(item => {
      const dp = item.dataset.page || '';
      return VERSIONED_PATHS.some(prefix => dp.startsWith(prefix));
    });
    let targetItem = null;
    matchList.forEach(item => {
      const dp = item.dataset.page || '';
      if (page === 'create' && !dp.includes('page=') && dp.includes('v2.9.3')) {
        targetItem = item;
      } else if (dp.includes('page=' + page)) {
        targetItem = item;
      }
    });
    if (targetItem) {
      items.forEach(node => node.classList.remove('active'));
      targetItem.classList.add('active');
      if (typeof updateCurrentPageKey === 'function') updateCurrentPageKey(targetItem.dataset.page);
      const r = routeFromPagePath(targetItem.dataset.page || '');
      setUrlRoute(r);
      refreshShareLink(r);
    }
  });
  // ===== 搜索 =====
  function applySearch() {
    const keyword = (layerSearch.value || '').trim().toLowerCase();
    let hasMatch = false;
    items.forEach(item => {
      const text = (item.dataset.search || item.textContent || '').toLowerCase();
      const visible = !keyword || text.includes(keyword);
      item.style.display = visible ? '' : 'none';
      if (visible) hasMatch = true;
    });
    versionFolders.forEach(folder => {
      const version = folder.dataset.version;
      const versionItems = Array.from(document.querySelectorAll('.version-pages[data-version="' + version + '"] .layer-item'));
      const visibleCount = versionItems.filter(item => item.style.display !== 'none').length;
      const shouldShow = !keyword || visibleCount > 0;
      folder.style.display = shouldShow ? '' : 'none';
      const pages = document.querySelector('.version-pages[data-version="' + version + '"]');
      if (pages) pages.style.display = shouldShow ? (keyword ? 'block' : '') : 'none';
    });
    layerEmpty.style.display = hasMatch || !keyword ? 'none' : 'block';
  }
  layerSearch.addEventListener('input', applySearch);
  // ===== 侧边栏记忆 =====
  if (localStorage.getItem('sidebar-collapsed') === 'true') toggleSidebar(false);
  // ===== 复制短链 =====
  if (shareLinkCopy && shareLinkInput) {
    shareLinkCopy.addEventListener('click', async () => {
      const value = shareLinkInput.value;
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        const old = shareLinkCopy.textContent;
        shareLinkCopy.textContent = '已复制';
        shareLinkCopy.classList.add('ok');
        setTimeout(() => {
          shareLinkCopy.textContent = old;
          shareLinkCopy.classList.remove('ok');
        }, 1500);
      } catch (e) {
        shareLinkInput.select();
        document.execCommand && document.execCommand('copy');
      }
    });
  }
  if (shareLinkInput) {
    shareLinkInput.addEventListener('focus', () => shareLinkInput.select());
  }
  // 切换短链格式
  document.querySelectorAll('.share-link-mode').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.share-link-mode').forEach(b => b.classList.toggle('active', b === btn));
      const currentRoute = (() => {
        try {
          const u = new URL(window.location.href);
          const raw = (u.searchParams.get('route') || '').trim();
          return raw || null;
        } catch (e) { return null; }
      })();
      refreshShareLink(currentRoute);
    });
  });
  // ===== 初始化路由 =====
  const initialRoute = getRouteFromUrl();
  const initialItem = (initialRoute && findItemByRoute(initialRoute)) || items[0];
  if (initialItem) {
    const route = routeFromPagePath(initialItem.dataset.page || '');
    items.forEach(node => node.classList.remove('active'));
    initialItem.classList.add('active');
    setUrlRoute(route);
    refreshShareLink(route);
    frame.src = withVersion(initialItem.dataset.page || '');
    if (typeof updateCurrentPageKey === 'function') updateCurrentPageKey(initialItem.dataset.page);
  }
  if (shareLinkHint) {
    const fileName = (window.location.pathname.replace(/^.*\//, '') || 'dev-mode.html');
    shareLinkHint.textContent = '当前 URL：' + fileName + '?route=<版本>/<页面>';
  }
  // ===== iframe 自适应高度（可选）=====
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'frameHeight') return;
    const frameEl = document.getElementById('designFrame');
    if (frameEl && typeof e.data.height === 'number') {
      frameEl.style.height = e.data.height + 'px';
    }
  });
</script>
</body>
</html>
