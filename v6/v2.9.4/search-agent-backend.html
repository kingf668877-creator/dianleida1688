<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后端对接文档</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d2129}.tabs-wrap{height:48px;display:flex;align-items:center;padding:0 20px;background:#fff;border-bottom:1px solid #e5e6eb;gap:4px;position:sticky;top:0;z-index:10}.tab-btn{height:32px;padding:0 16px;border:0;border-radius:6px;background:transparent;color:#4e5969;font-size:13px;font-weight:500;cursor:pointer}.tab-btn:hover{background:#f2f3f5;color:#1d2129}.tab-btn.active{background:#f0ebff;color:#6236ff;font-weight:600}.tab-btn .tab-dot{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;vertical-align:-1px}.tab-preview .tab-dot{background:#ff6b6b}.tab-spec .tab-dot{background:#3370ff}.tab-html .tab-dot{background:#e34f26}.tab-css .tab-dot{background:#1572b6}.tab-js .tab-dot{background:#b58b00}.panels{height:calc(100vh - 48px);overflow:hidden;position:relative}.panel{position:absolute;inset:0;display:none;overflow:auto}.panel.active{display:block}#panel-preview iframe{width:100%;height:100%;border:0;display:block;background:#fff}.code-panel{padding:20px}.code-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.code-header small{color:#86909c;font:12px Consolas,monospace}.copy-btn{height:30px;padding:0 14px;border:1px solid #e5e6eb;border-radius:6px;background:#fff;color:#4e5969;font-size:12px;cursor:pointer}.copy-btn:hover{border-color:#6236ff;color:#6236ff}.copy-btn.ok{background:#16a36a;border-color:#16a36a;color:#fff}pre.code{margin:0;padding:20px;overflow:auto;border:1px solid #e5e6eb;border-radius:10px;background:#fafbfc;color:#334155;font:13px/1.7 Consolas,"Microsoft YaHei",monospace;white-space:pre;tab-size:2;min-height:calc(100% - 50px)}.spec-panel-page{background:#f7f8fa}.spec-yuque-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px}.spec-yuque-info{font-size:14px;color:#86909c;text-align:center;margin:0}.spec-yuque-link{display:inline-flex;align-items:center;gap:6px;padding:13px 28px;border-radius:8px;background:linear-gradient(135deg,#3370ff,#5b47fb);color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 4px 16px rgba(51,112,255,.3)}
</style>
</head>
<body>
<div class="tabs-wrap" role="tablist"><button class="tab-btn tab-preview active" data-tab="preview" role="tab"><span class="tab-dot"></span>效果图</button><button class="tab-btn tab-spec" data-tab="spec" role="tab"><span class="tab-dot"></span>原型说明</button><button class="tab-btn tab-html" data-tab="html" role="tab"><span class="tab-dot"></span>HTML</button><button class="tab-btn tab-css" data-tab="css" role="tab"><span class="tab-dot"></span>CSS</button><button class="tab-btn tab-js" data-tab="js" role="tab"><span class="tab-dot"></span>JS</button></div>
<div class="panels"><section class="panel active" id="panel-preview"><iframe src="backend-doc.html?v=20260814d" title="效果图"></iframe></section><section class="panel spec-panel-page" id="panel-spec"><div class="spec-yuque-wrap"><p class="spec-yuque-info">点击下方链接查看完整原型说明文档</p><a class="spec-yuque-link" href="https://www.yuque.com/u26544515/sldqp9/xlf8hgmqhski5mfe?singleDoc#" target="_blank" rel="noopener">打开语雀 · 店雷达原型说明 ↗</a></div></section><section class="panel code-panel" id="panel-html"><div class="code-header"><small>backend-doc.html</small><button class="copy-btn" data-copy="html">复制 HTML</button></div><pre class="code" id="codeHtml">正在加载…</pre></section><section class="panel code-panel" id="panel-css"><div class="code-header"><small>&lt;style&gt;（内联于 backend-doc.html）</small><button class="copy-btn" data-copy="css">复制 CSS</button></div><pre class="code" id="codeCss">正在加载…</pre></section><section class="panel code-panel" id="panel-js"><div class="code-header"><small>&lt;script&gt;（内联于 backend-doc.html）</small><button class="copy-btn" data-copy="js">复制 JS</button></div><pre class="code" id="codeJs">正在加载…</pre></section></div>
<script>
const tabs=document.querySelectorAll('.tab-btn'),panels=document.querySelectorAll('.panel');tabs.forEach(btn=>btn.addEventListener('click',()=>{const tab=btn.dataset.tab;tabs.forEach(b=>b.classList.toggle('active',b===btn));panels.forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab))}));const codeCache={html:'',css:'',js:''};function extract(html,tag){const re=new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)<\\/'+tag+'>','gi'),out=[];let m;while((m=re.exec(html))!==null)out.push(m[1].trim());return out.length?out.join('\n\n'):'（该页面无内联 '+tag+' 标签）'}fetch('backend-doc.html').then(r=>{if(!r.ok)throw Error('加载失败');return r.text()}).then(text=>{codeCache.html=text;codeCache.css=extract(text,'style');codeCache.js=extract(text,'script');codeHtml.textContent=text;codeCss.textContent=codeCache.css;codeJs.textContent=codeCache.js}).catch(()=>{codeHtml.textContent='加载失败：backend-doc.html';codeCss.textContent='加载失败';codeJs.textContent='加载失败'});document.querySelectorAll('.copy-btn').forEach(btn=>btn.addEventListener('click',async()=>{const text=codeCache[btn.dataset.copy];if(!text)return;try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent='已复制';btn.classList.add('ok');setTimeout(()=>{btn.textContent=old;btn.classList.remove('ok')},1500)}catch(e){}}));
</script>
</body>
</html>
