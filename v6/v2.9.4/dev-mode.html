<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店雷达 V2.9.4 - 开发模式</title>
<link rel="icon" type="image/png" href="../v2.9.3/logo.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1d2129;background:#f5f6f8}.app{display:flex;width:100%;height:100vh}.layers{width:224px;flex:0 0 224px;background:#fff;border-right:1px solid #e5e6eb;display:flex;flex-direction:column;transition:width .25s,flex-basis .25s;overflow:hidden}.layers.collapsed{width:0;flex-basis:0;border-right:0}.layers-title{height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid #e5e6eb;font-size:15px;font-weight:600;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand img{width:28px;height:28px;border-radius:6px}.icon-btn{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#86909c;cursor:pointer;font-size:15px}.icon-btn:hover{background:#f2f3f5;color:#1d2129}.nav-list{padding:12px 8px;flex:1}.nav-item{width:100%;height:42px;padding:0 12px;border:0;border-radius:6px;background:#e8f0ff;color:#3370ff;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer;text-align:left}.nav-icon{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;font-weight:700}.stage{min-width:0;flex:1;height:100%;background:#eef0f3;padding:20px}.frame-shell{height:100%;overflow:hidden;background:#fff;border:1px solid #dfe1e5;border-radius:8px;box-shadow:0 8px 24px rgba(29,33,41,.08)}iframe{width:100%;height:100%;border:0;display:block}.expand-btn{position:fixed;top:12px;left:12px;z-index:20;width:40px;height:40px;border:1px solid #e5e6eb;border-radius:8px;background:#fff;color:#4e5969;cursor:pointer;display:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}.expand-btn.show{display:block}@media(max-width:720px){.layers{width:176px;flex-basis:176px}.stage{padding:10px}}
</style>
</head>
<body>
<div class="app">
<button class="expand-btn" id="expandBtn" title="展开导航">☰</button>
<aside class="layers" id="layers"><div class="layers-title"><div class="brand"><img src="../v2.9.3/logo.png" alt="店雷达"><span>店雷达选品</span></div><button class="icon-btn" id="collapseBtn" title="收起导航">✕</button></div><nav class="nav-list"><button class="nav-item" type="button"><span class="nav-icon">抖</span><span>抖音选品</span></button></nav></aside>
<main class="stage"><div class="frame-shell"><iframe src="package-config.html" title="抖音选品套餐配置"></iframe></div></main>
</div>
<script>const layers=document.getElementById('layers'),expandBtn=document.getElementById('expandBtn');document.getElementById('collapseBtn').addEventListener('click',()=>{layers.classList.add('collapsed');expandBtn.classList.add('show')});expandBtn.addEventListener('click',()=>{layers.classList.remove('collapsed');expandBtn.classList.remove('show')});</script>
</body>
</html>
