<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套餐配置 - OZONAI搜索</title>
<link rel="icon" type="image/png" href="../v2.9.3/logo.png">
<link rel="stylesheet" href="package-config.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title">套餐配置</div>
  <nav class="top-tabs" aria-label="套餐类型">
    <button class="top-tab" type="button">1688会员</button>
    <button class="top-tab" type="button">OZON会员</button>
    <button class="top-tab active" type="button">OZONAI搜索</button>
  </nav>
  <div class="topbar-actions"><button class="help-btn" type="button">?</button><span class="account">店雷达账号</span></div>
</header>
<main class="page-content">
  <section class="search-intro">
    <div class="eyebrow"><span class="spark">✦</span> OZON AI 智能选品</div>
    <h1>用一句话，找到值得卖的 OZON 商品</h1>
    <p>输入你的选品想法，AI 将自动理解需求并搜索匹配商品</p>
    <form class="ai-search" id="searchForm">
      <textarea id="searchInput" maxlength="500" placeholder="描述你想找的商品，例如：适合俄罗斯冬季销售、客单价 2000 卢布以内的女士保暖手套"></textarea>
      <div class="search-footer">
        <div class="search-tools">
          <button class="tool-btn" type="button" id="clearBtn" title="清空输入">⌫</button>
          <span class="count"><b id="charCount">0</b>/500</span>
        </div>
        <button class="search-btn" id="searchBtn" type="submit"><span>⌕</span> 开始搜索</button>
      </div>
    </form>
    <div class="examples">
      <span class="examples-label">试试这样问：</span>
      <button type="button">夏季户外露营用品</button>
      <button type="button">俄罗斯家庭常用的厨房收纳</button>
      <button type="button">低退货率的女士服饰</button>
    </div>
  </section>
  <section class="result-panel" id="resultPanel" aria-live="polite">
    <div class="result-icon">AI</div>
    <div><strong>正在分析你的选品需求</strong><p id="resultText">提取类目、价格带和消费场景后，将展示 OZON 商品结果。</p></div>
  </section>
</main>
<script src="package-config.js"></script>
</body>
</html>
